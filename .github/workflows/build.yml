name: NeoForge 1.21.1 build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Source and asset integrity checks
        run: python3 -m unittest discover -s qa -p 'test_*.py' -v
      - name: Java 21 observer state-machine executable acceptance
        run: |
          mkdir -p build/observer-brain-smoke
          javac -d build/observer-brain-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/ObserverBrain.java \
            qa/java/ObserverBrainSmoke.java
          java -cp build/observer-brain-smoke ObserverBrainSmoke
      - name: Test optional Nightwatch encounter fairness and budgets (pure Java21)
        run: |
          mkdir -p build/encounter-policy-smoke
          javac -d build/encounter-policy-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/EncounterPolicy.java \
            qa/java/EncounterPolicySmoke.java
          java -cp build/encounter-policy-smoke EncounterPolicySmoke
      - name: Verify v0.3 atmospheric cue timing, opt-out and volume ceilings
        run: |
          mkdir -p build/haunting-cue-smoke
          javac -d build/haunting-cue-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/ObserverBrain.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/HauntingCuePolicy.java \
            qa/java/HauntingCuePolicySmoke.java
          java -cp build/haunting-cue-smoke HauntingCuePolicySmoke
      - name: Verify v0.4 witness journal narrative, deduplication and limits
        run: |
          mkdir -p build/witness-journal-smoke
          javac -d build/witness-journal-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/ObserverBrain.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/WitnessJournalPolicy.java \
            qa/java/WitnessJournalPolicySmoke.java
          java -cp build/witness-journal-smoke WitnessJournalPolicySmoke
      - name: Enforce localhost-only Ollama policy (pure Java21)
        run: |
          mkdir -p build/ollama-policy-smoke
          javac -d build/ollama-policy-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/ollama/OllamaEndpointPolicy.java \
            qa/java/OllamaEndpointPolicySmoke.java
          java -cp build/ollama-policy-smoke OllamaEndpointPolicySmoke
      - name: Compile and package NeoForge mod
        run: gradle --no-daemon --stacktrace build
      - uses: actions/upload-artifact@v4
        with:
          name: gugugaga-nightwatch-jar
          path: build/libs/*.jar
          if-no-files-found: error
