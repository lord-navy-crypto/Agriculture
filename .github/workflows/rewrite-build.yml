name: Agriculture & Apiaries (NeoForge 1.21.1)
on:
  push:
    branches:
      - 'feat/agriculture/**'
  pull_request:

jobs:
  validate-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate crop resources, loot tables, translations, and recipes
        run: |
          python3 qa/validate_agriculture_assets.py
          python3 qa/validate_agriculture_expansion.py
          python3 qa/validate_agriculture_ecology.py

  neoforge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and package agriculture mod
        run: gradle --no-daemon --stacktrace build
      - uses: actions/upload-artifact@v4
        with:
          name: gugu-gaga-agriculture
          path: build/libs/*.jar
          if-no-files-found: error

  real-server-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Launch fresh real NeoForge 1.21.1 server
        run: python3 qa/smoke_rewrite_server.py
      - name: Upload launch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agriculture-server-launch-log
          path: build/agriculture-server-boot.log
          if-no-files-found: warn
