name: Backroom Agriculture (NeoForge 1.21.1)
on:
  push:
    branches:
      - 'feat/agriculture/**'
      - 'feature/threshold-dimensions-level0-level1'
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Supersede stale asset-by-asset runs with the latest branch validation.
# Push and pull-request events for the same head branch share one concurrency group.
concurrency:
  group: backroom-agriculture-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate Threshold dimension architecture contracts
        run: python3 qa/validate_threshold_graph.py
      - name: Protect original Threshold horror identity and spatial layout
        run: python3 qa/validate_threshold_horror_preservation.py
      - name: Validate six-level source-backed transit and hotel expansion
        run: python3 qa/validate_threshold_expansion.py
      - name: Validate Threshold Agriculture nutrition and hydration integration
        run: python3 qa/validate_threshold_survival_integration.py
      - name: Validate unified Backroom Agriculture architecture and greenhouse loop
        run: python3 qa/validate_backroom_agriculture_v4_0.py
      - name: Validate per-food 27-nutrient hover profiles
        run: python3 qa/validate_nutrition_tooltips_v4_0.py
      - name: Validate v4.1 per-food overrides, safe limits and cross-dimensional nutrition clock
        run: python3 qa/validate_nutrition_v4_1.py
      - name: Validate immediate nutrition feedback, no double credit, and vegetable profiles
        run: python3 qa/validate_nutrition_immediate_v4_6.py
      - name: Validate v4.7 nutrition GUI snapshots and all food profiles
        run: python3 qa/validate_nutrition_gui_and_profiles_v4_7.py
      - name: Validate v4.11 balanced nutrition recovery, cap mathematics and bilingual UI
        run: python3 qa/validate_nutrition_balance_v4_11.py
      - name: Validate v4.3 closed-loop water and salt gameplay balance
        run: python3 qa/validate_water_balance_v4_3.py
      - name: Validate Backrooms v4.4 brine, water art and opt-in architecture contracts
        run: python3 qa/validate_water_anomaly_v4_4.py
      - name: Validate irregular Level 0 and Level 1 room geometry
        run: python3 qa/validate_threshold_irregular_maze.py
      - name: Validate smarter Backrooms entities and scoped Partygoer respawn
        run: python3 qa/validate_backroom_entity_ai_v4_1.py
      - name: Validate Distant Watcher encounters, Partygoer pack AI and Backrooms creative tabs
        run: python3 qa/validate_threshold_entities_creative_v1.py
      - name: Check actual Agriculture item IDs used by Backrooms survival loot
        run: python3 qa/validate_threshold_agriculture_loot.py
      - name: Validate crop resources, loot tables, translations, and recipes
        run: |
          python3 qa/validate_agriculture_assets.py
          python3 qa/validate_agriculture_release_cycle_v2_2.py
          python3 qa/validate_wild_seed_sources_v1_0.py
          python3 qa/validate_agriculture_expansion.py
          python3 qa/validate_agriculture_ecology.py
          python3 qa/validate_bee_biodiversity.py
          python3 qa/validate_agronomic_sources.py
          python3 qa/validate_agriculture_v0_3.py
          python3 qa/validate_rice_paddy.py
          python3 qa/validate_pollination_and_honey.py
          python3 qa/validate_bee_nest_habitats.py
          python3 qa/validate_crop_and_nectar_expansion.py
          python3 qa/validate_crop_diversity_v1_0.py
          python3 qa/validate_suspicious_stew_honey_parity.py
          python3 qa/validate_crop_v1_3.py
          python3 qa/validate_crop_lifecycle_v1_4.py
          python3 qa/validate_agriculture_compost_v1_3.py
          python3 qa/validate_agriculture_v1_7.py
          python3 qa/validate_agriculture_v1_8.py
          python3 qa/validate_agriculture_v1_9.py
          python3 qa/validate_agriculture_v2_0.py
          python3 qa/validate_agriculture_v2_1.py
          python3 qa/validate_marine_fungi_v1_0.py
          python3 qa/validate_crop_cuisine_v1_0.py
          python3 qa/validate_crop_cuisine_v1_1.py
          python3 qa/validate_crop_cuisine_v1_2.py
          python3 qa/validate_crop_cuisine_v1_3.py
          python3 qa/validate_crop_cuisine_v1_4.py
          python3 qa/validate_crop_cuisine_v1_5.py
          python3 qa/validate_crop_cuisine_v1_6.py
          python3 qa/validate_crop_cuisine_v1_7.py
          python3 qa/validate_crop_cuisine_v1_8.py
          python3 qa/validate_kitchen_expansion_v2_8.py
          python3 qa/validate_vanilla_kitchen_v2_9.py
          python3 qa/validate_kitchen_v3_0.py
          python3 qa/validate_kitchen_v3_1.py
          python3 qa/validate_kitchen_v3_2.py
          python3 qa/validate_food_ecology_v3_3.py
          python3 qa/validate_salt_nutrition_v3_4.py
          python3 qa/validate_nutrition_v3_5.py
          python3 qa/validate_lunar_seasons_v3_6.py
          python3 qa/validate_survival_water_v3_7.py
          python3 qa/validate_water_nutrition_v3_8.py
          python3 qa/validate_nutrition_feedback_v3_8.py
          python3 qa/validate_nutrition_physiology_v3_9.py
          python3 qa/validate_nutrition_effects_v3_10.py
          python3 qa/validate_honey_source_contract_v1_0.py
          python3 qa/validate_honey_source_coverage_v1_1.py
          python3 qa/validate_swaying_garden_compat_v311.py

  neoforge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verified Gradle 9.2.1
        shell: bash
        run: |
          set -euo pipefail
          VERSION="9.2.1"
          ZIP="$RUNNER_TEMP/gradle-$VERSION-bin.zip"
          EXPECTED_SHA256="72f44c9f8ebcb1af43838f45ee5c4aa9c5444898b3468ab3f4af7b6076c5bc3f"

          download_gradle() {
            local url="$1"
            echo "Downloading Gradle $VERSION from $url"
            curl --fail --location --show-error --silent \
              --retry 3 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 900 \
              "$url" --output "$ZIP"
          }

          if ! download_gradle "https://downloads.gradle.org/distributions/gradle-$VERSION-bin.zip"; then
            rm -f "$ZIP"
            if ! download_gradle "https://repo.huaweicloud.com/repository/toolkit/gradle/gradle-$VERSION-bin.zip"; then
              rm -f "$ZIP"
              download_gradle "https://mirrors.nju.edu.cn/gradle/gradle-$VERSION-bin.zip"
            fi
          fi

          echo "$EXPECTED_SHA256  $ZIP" | sha256sum --check --status
          unzip -q "$ZIP" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$VERSION/bin" >> "$GITHUB_PATH"
          gradle --version
      - name: Compile and package Backroom Agriculture
        run: gradle --no-daemon --stacktrace build
      - name: Verify v4.4 generated water textures and RealScale anomaly resources in JAR
        run: python3 qa/validate_water_anomaly_v4_4.py build/libs/gugugaga-4.0.0-alpha.1.jar
      - name: Verify v4.5 connected city lifts and vanilla structures in JAR
        run: python3 qa/validate_anomaly_worldgen_v4_5.py build/libs/gugugaga-4.0.0-alpha.1.jar
      - name: Validate all six Backrooms dimensions in the unified JAR
        run: python3 qa/validate_threshold_dimensions.py build/libs/gugugaga-4.0.0-alpha.1.jar
      - name: Validate crop item icon polish and review sheets
        run: python3 qa/validate_crop_item_visual_audit.py build/reports/agriculture
      - name: Validate kitchen icon generator and four-station recipes
        run: python3 qa/validate_kitchen_expansion_v2_8.py build/generated/resources/kitchenAssets
      - name: Validate vanilla pantry and kitchen-generated 79-item pixel sheet
        run: python3 qa/validate_vanilla_kitchen_v2_9.py build/generated/resources/kitchenAssets
      - name: Validate new kitchen v3 graphics and appliance animations
        run: python3 qa/validate_kitchen_v3_0.py build/generated/resources/kitchenV3Assets
      - name: Validate visual animation v3.11 and packaged sprite frames
        run: python3 qa/validate_visual_animation_v311.py build/libs/gugugaga-*.jar
      - name: Validate GeckoLib 4.9.3 kitchen rigs and packaged animations
        run: python3 qa/validate_geckolib_kitchen_v311.py build/libs/gugugaga-*.jar
      - name: Verify kitchen v3.1 specialist art and actual workstation models
        run: python3 qa/validate_kitchen_v3_1.py build/generated/resources/kitchenV31Assets
      - name: Validate kitchen v3.2 offhand-tool modes and 47 item images
        run: python3 qa/validate_kitchen_v3_2.py build/generated/resources/kitchenV32Assets
      - name: Validate eight crop textures and food-fermentation graphics
        run: python3 qa/validate_food_ecology_v3_3.py build/generated/resources/foodEcologyV33Assets
      - name: Validate salt, fermentation and nutrition v3.4 generated textures
        run: python3 qa/validate_salt_nutrition_v3_4.py build/generated/resources/seasoningsV34Assets
      - name: Verify all edible foods and compiled 27-nutrient catalog in mod JAR
        run: python3 qa/validate_nutrition_v3_5.py build/libs/gugugaga-*.jar
      - name: Verify 32-day lunar calendar and seasonal classes in mod JAR
        run: python3 qa/validate_lunar_seasons_v3_6.py build/libs/gugugaga-*.jar
      - name: Check v3.7 water items, nutrition UI and compiled hydration catalog
        run: python3 qa/validate_survival_water_v3_7.py build/libs/gugugaga-*.jar
      - name: Verify v3.8 water ecology and nutrition classes in JAR
        run: python3 qa/validate_water_nutrition_v3_8.py build/libs/gugugaga-*.jar
      - name: Verify completed nutrition feedback groups and GUI in JAR
        run: python3 qa/validate_nutrition_feedback_v3_8.py build/libs/gugugaga-*.jar
      - name: Validate v3.9 evidence-informed nutrient mechanics and jar
        run: python3 qa/validate_nutrition_physiology_v3_9.py build/libs/gugugaga-*.jar
      - name: Validate all 27 positive/negative nutrition effect pairs in packaged JAR
        run: python3 qa/validate_nutrition_effects_v3_10.py build/libs/gugugaga-*.jar
      - name: Validate v3.9 release metadata in packaged mod JAR
        run: python3 qa/validate_release_metadata_v2_7.py build/libs
      - name: Verify one-JAR embedded optional Fusion visuals and standalone compatibility
        run: python3 qa/validate_embedded_fusion_v2_7.py build/libs/gugugaga-*.jar build/distributions/gugugaga-fusion-visuals-v2.7.zip
      - name: Cross-check all shipped Fusion sprite pixels against packaged JAR
        run: python3 qa/validate_fusion_render_variants.py build/libs/gugugaga-*.jar build/distributions/gugugaga-fusion-visuals-v2.7.zip
      - name: Resolve optional Fusion 1.21.1 development dependency
        run: gradle --no-daemon -PenableFusionDev=true dependencies --configuration runtimeClasspath
      - name: Validate optional Fusion v2.7 crop, marine, fungal and habitat resources
        run: python3 qa/validate_fusion_visual_pack_v2_7.py build/fusion-visual-pack build/distributions/gugugaga-fusion-visuals-v2.7.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gugugaga-fusion-visuals-v2.7
          path: build/distributions/gugugaga-fusion-visuals-v2.7.zip
          if-no-files-found: error
      - name: Validate generated honey bottle sprites
        run: python3 qa/validate_generated_honey_art.py build/generated/resources/cropAssets
      - name: Validate generated marine and fungal pixel art
        run: python3 qa/validate_generated_marine_fungi_art.py build/generated/resources/marineFungiAssets
      - name: Validate generated crop-cuisine pixel art
        run: python3 qa/validate_generated_crop_cuisine_art.py build/generated/resources/cropCuisineAssets build/reports/agriculture/crop-cuisine-item-contact-sheet.png
      - uses: actions/upload-artifact@v4
        with:
          name: backroom-agriculture
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Upload agriculture visual proof sheets
        uses: actions/upload-artifact@v4
        with:
          name: agriculture-visual-proof
          path: build/reports/agriculture/*.png
          if-no-files-found: error
      - name: Upload crop item visual audit CSV
        uses: actions/upload-artifact@v4
        with:
          name: crop-item-icon-audit-v2.5
          path: build/reports/agriculture/crop-item-icon-audit.csv
          if-no-files-found: error

  real-server-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verified Gradle 9.2.1
        shell: bash
        run: |
          set -euo pipefail
          VERSION="9.2.1"
          ZIP="$RUNNER_TEMP/gradle-$VERSION-bin.zip"
          EXPECTED_SHA256="72f44c9f8ebcb1af43838f45ee5c4aa9c5444898b3468ab3f4af7b6076c5bc3f"

          download_gradle() {
            local url="$1"
            echo "Downloading Gradle $VERSION from $url"
            curl --fail --location --show-error --silent \
              --retry 3 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 900 \
              "$url" --output "$ZIP"
          }

          if ! download_gradle "https://downloads.gradle.org/distributions/gradle-$VERSION-bin.zip"; then
            rm -f "$ZIP"
            if ! download_gradle "https://repo.huaweicloud.com/repository/toolkit/gradle/gradle-$VERSION-bin.zip"; then
              rm -f "$ZIP"
              download_gradle "https://mirrors.nju.edu.cn/gradle/gradle-$VERSION-bin.zip"
            fi
          fi

          echo "$EXPECTED_SHA256  $ZIP" | sha256sum --check --status
          unzip -q "$ZIP" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$VERSION/bin" >> "$GITHUB_PATH"
          gradle --version
      - name: Launch fresh real NeoForge 1.21.1 server
        run: python3 qa/smoke_rewrite_server.py
      - name: Launch unified Backroom Agriculture server and verify all six dimensions and generated chunks
        run: python3 qa/smoke_threshold_server.py
      - name: Upload launch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agriculture-server-launch-log
          path: build/agriculture-server-boot.log
          if-no-files-found: warn
      - name: Upload Threshold server diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threshold-server-diagnostics
          path: |
            build/threshold-server-boot.log
            run/server/logs/latest.log
          if-no-files-found: warn
