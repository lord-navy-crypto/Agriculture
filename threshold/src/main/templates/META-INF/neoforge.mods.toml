description='''
An independent psychological and liminal horror exploration mod for Minecraft 1.21.1.
The first release adds separate Level 0 and Level 1 dimensions with deterministic,
chunk-safe room generation. Agriculture integration is optional and is not required.
'''

[[dependencies.${mod_id}]]
