modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/lord-navy-crypto/Agriculture/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/lord-navy-crypto/Agriculture"
authors="Threshold development contributors"
description='''
An independent Backrooms-inspired environment mod with Level 0, Level 1, Level 2, Level 3 and Level 4 dimensions.
Gugu-Gaga Agriculture is a required survival dependency for this development build.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="gugugaga"
type="required"
versionRange="[3.9,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[4.9.3,5)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="lithostitched"
type="required"
versionRange="[1.7.11,2)"
ordering="AFTER"
side="BOTH"
