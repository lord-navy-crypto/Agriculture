plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

group = 'io.github.lordnavycrypto.threshold'
version = '0.1.0-alpha.19'
base { archivesName = 'threshold' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def thresholdModId = 'threshold'
def thresholdModName = 'Threshold: Backrooms'
def thresholdMinecraftVersion = '1.21.1'
def thresholdNeoVersion = '21.1.259'

// Required external mods are kept separate: never jarJar library mods into Threshold.
repositories {
    maven {
        name = 'GeckoLib'
        url = uri('https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/')
        content { includeGroup 'software.bernie.geckolib' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = uri('https://api.modrinth.com/maven')
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.3'
    implementation 'maven.modrinth:XaDC71GB:a9fuYUVh' // Lithostitched 1.7.11 NeoForge 21.1
}

neoForge {
    version = thresholdNeoVersion
    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = thresholdMinecraftVersion
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        threshold {
            sourceSet(sourceSets.main)
        }
    }
}

def generateThresholdModMetadata = tasks.register('generateThresholdModMetadata', ProcessResources) {
    def vars = [
        mod_id: thresholdModId,
        mod_name: thresholdModName,
        mod_version: project.version,
        mod_license: 'MIT',
        loader_version_range: '[1,)',
        minecraft_version_range: '[1.21.1]',
        neo_version: thresholdNeoVersion
    ]
    inputs.properties(vars)
    expand(vars)
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/thresholdModMetadata')
}

sourceSets.main.resources.srcDir(generateThresholdModMetadata)
neoForge.ideSyncTask(generateThresholdModMetadata)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

