import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.awt.image.BufferedImage
import java.awt.Color
import java.awt.Font
import java.awt.Graphics2D
import java.awt.RenderingHints
import javax.imageio.ImageIO

/*
 * Fusion v2.4 companion RESOURCE PACK, not a hard dependency of the mod JAR.
 * Official format: Fusion random texture tiles + fusion:base block models.
 * Models are copied from already-registered bee habitat blocks and only their
 * texture references are changed. The default textures remain fully vanilla.
 * v2.6 also overlays all generated crop-stage textures with optional Fusion random variants.
 */
def fusionPackRoot = layout.buildDirectory.dir('fusion-visual-pack')
def fusionProof = layout.buildDirectory.dir('reports/agriculture')

tasks.register('generateFusionVisualPack') {
    dependsOn tasks.named('generateCropAssets')
    inputs.dir(layout.buildDirectory.dir('generated/resources/cropAssets/assets/gugugaga/textures/block/crops'))
    inputs.files(fileTree('src/main/resources/assets/gugugaga/models/block') {
        include '*_bee_habitat*.json'
        include 'bumblebee_habitat*.json'
    })
    outputs.dir(fusionPackRoot)
    outputs.file(fusionProof.map { it.file('fusion-habitat-contact-sheet.png') })
    outputs.file(fusionProof.map { it.file('fusion-crop-random-variants-contact-sheet.png') })
    doLast {
        File root = fusionPackRoot.get().asFile
        project.delete(root)
        root.mkdirs()
        def json = new JsonSlurper()
        def putText = { String path, Object value ->
            File target = new File(root, path)
            target.parentFile.mkdirs()
            target.setText(JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n', 'UTF-8')
        }
        putText('pack.mcmeta', [
            pack:[pack_format:34, description:'Gugu Gaga Agriculture - optional Fusion crop field and habitat textures (v2.6)']
        ])
        // Standalone resource-pack icon: farm-green ground, sprout and amber honey.
        BufferedImage packIcon = new BufferedImage(64,64,BufferedImage.TYPE_INT_ARGB)
        for(int y=0;y<64;y++) for(int x=0;x<64;x++) {
            int rgb = y < 45 ? 0x314A36 : 0x725038
            if ((x+y)%13==0) rgb = y < 45 ? 0x3C5941 : 0x7F5A40
            packIcon.setRGB(x,y,(int)(0xFF000000L | rgb))
        }
        // Two leaves branching from a central stalk; warm honey orb below.
        for(int y=10;y<=44;y++) for(int x=30;x<=33;x++)
            packIcon.setRGB(x,y,(int)0xFF90BC6B)
        for(int y=13;y<33;y++) for(int x=8;x<30;x++) {
            int dx=x-22, dy=y-24
            if(dx*dx*3+dy*dy*2<220 && x + y < 55)
                packIcon.setRGB(x,y,(int)(0xFF000000L|0x91C86E))
        }
        for(int y=11;y<34;y++) for(int x=34;x<57;x++) {
            int dx=x-41, dy=y-24
            if(dx*dx*3+dy*dy*2<220 && x-y>13)
                packIcon.setRGB(x,y,(int)(0xFF000000L|0xB0D875))
        }
        for(int y=42;y<58;y++) for(int x=37;x<52;x++) {
            int dx=x-44,dy=y-49
            if(dx*dx+dy*dy<57)
                packIcon.setRGB(x,y,(int)(0xFF000000L|((x+y)%6==0?0xF4CF66:0xD89B35)))
        }
        if(!ImageIO.write(packIcon,'png',new File(root,'pack.png')))
            throw new GradleException('Unable to encode companion pack icon')

        // Independently drawn warm/botanical palettes; do NOT copy Fusion sprites.
        def palettes = [
            bumblebee:[base:0x52683C, dark:0x293F30, light:0x83A568, accent:0xE0C75C],
            mason:[base:0xA46C53, dark:0x543F42, light:0xD8AA80, accent:0xE4C89B],
            leafcutter:[base:0x597A5B, dark:0x294F49, light:0x99B881, accent:0xE4A4B3],
            squash:[base:0x957343, dark:0x55462C, light:0xC9AB6A, accent:0xD99D48]
        ]
        def pixels = { BufferedImage img, int x, int y, int color ->
            if (x >= 0 && x < img.width && y >= 0 && y < img.height)
                img.setRGB(x,y,(int)(0xFF000000L | (color & 0xFFFFFF)))
        }
        def rect = { BufferedImage img, int x1, int y1, int x2, int y2, int color ->
            for (int y = y1; y <= y2; y++) for (int x = x1; x <= x2; x++) pixels.call(img,x,y,color)
        }
        def types = ['bumblebee','mason','leafcutter','squash']
        BufferedImage proof = new BufferedImage(4 * 96, 2 * 96, BufferedImage.TYPE_INT_ARGB)
        types.eachWithIndex { String type, int typeIndex ->
            def pal = palettes[type]
            ['side','roof'].eachWithIndex { String surface, int surfaceIndex ->
                BufferedImage atlas = new BufferedImage(32,32,BufferedImage.TYPE_INT_ARGB)
                for (int variant = 0; variant < 4; variant++) {
                    BufferedImage tile = new BufferedImage(16,16,BufferedImage.TYPE_INT_ARGB)
                    rect.call(tile,0,0,15,15,pal.base)
                    // Four coherent hand-coded variants per surface, seeded by habitat.
                    for (int y = 0; y < 16; y++) for (int x = 0; x < 16; x++) {
                        int noise = Math.floorMod(x * 19 + y * 11 + variant * 13 + typeIndex * 31, 17)
                        if (noise == 0 || noise == 1) pixels.call(tile,x,y,pal.light)
                        if (noise == 13) pixels.call(tile,x,y,pal.dark)
                    }
                    if (surface == 'side') {
                        for (int y : [3,9,14]) rect.call(tile,0,y,15,y,pal.dark)
                        for (int y : [0,4,10]) {
                            int knot = Math.floorMod(variant * 5 + y + typeIndex, 10) + 3
                            rect.call(tile,knot,y+1,Math.min(knot+3,14),y+1,pal.light)
                            pixels.call(tile,knot+1,y+2,pal.dark)
                        }
                        if (type == 'mason') {
                            for (int y : [4,10]) rect.call(tile,0,y,15,y,pal.dark)
                            for (int x : [5,12]) rect.call(tile,x,0,x,3,pal.dark)
                            for (int x : [2,9]) rect.call(tile,x,5,x,9,pal.dark)
                        } else if (type == 'leafcutter') {
                            for (int i = 0; i < 4; i++) {
                                int x = 2 + i*3, y = 2 + Math.floorMod(i + variant, 3)*3
                                rect.call(tile,x,y,x+1,y+3,pal.light)
                                pixels.call(tile,x+2,y+1,pal.accent)
                            }
                        } else if (type == 'bumblebee') {
                            for (int i = 0; i < 5; i++) {
                                int x = Math.floorMod(variant*3+i*5,14)+1, y = 2+Math.floorMod(i*4,10)
                                pixels.call(tile,x,y,pal.accent)
                                pixels.call(tile,x+1,y,pal.dark)
                            }
                        } else {
                            for (int i = 0; i < 7; i++) {
                                int x = 1+Math.floorMod(variant*7+i*5,14), y = 1+Math.floorMod(i*3+variant,13)
                                pixels.call(tile,x,y,pal.accent)
                            }
                        }
                    } else {
                        for (int y : [2,7,12]) {
                            for (int x = 1; x <= 14; x++) {
                                pixels.call(tile,x,y,(x + variant) % 3 == 0 ? pal.accent : pal.dark)
                                if (y+1 < 16 && (x+variant)%2 == 0) pixels.call(tile,x,y+1,pal.light)
                            }
                        }
                        if (type == 'leafcutter' || type == 'bumblebee') {
                            for (int i = 0; i < 5; i++) {
                                int x = Math.floorMod(i*3+variant,13)+1, y = Math.floorMod(i*5+typeIndex,13)+1
                                pixels.call(tile,x,y,pal.accent)
                            }
                        }
                    }
                    int ox=(variant%2)*16, oy=(variant.intdiv(2))*16
                    for (int y = 0; y < 16; y++) for (int x = 0; x < 16; x++)
                        atlas.setRGB(ox+x,oy+y,tile.getRGB(x,y))
                    int tx=typeIndex*96 + (variant%2)*44 + 8
                    int ty=surfaceIndex*96 + (variant.intdiv(2))*44 + 8
                    for (int y = 0; y < 16; y++) for (int x = 0; x < 16; x++) {
                        int rgba=tile.getRGB(x,y)
                        for (int dy=0;dy<2;dy++) for (int dx=0;dx<2;dx++)
                            proof.setRGB(tx+x*2+dx,ty+y*2+dy,rgba)
                    }
                }
                String texture='assets/gugugaga/textures/block/fusion/' + type + '_' + surface + '.png'
                File out = new File(root,texture)
                out.parentFile.mkdirs()
                if(!ImageIO.write(atlas,'png',out)) throw new GradleException('Unable to write Fusion atlas '+texture)
                putText(texture+'.mcmeta',[fusion:[type:'random',rows:2,columns:2,
                    randomness_source:'position_facing',seed:8300 + typeIndex*10 + surfaceIndex]])
            }
            String habitat = type == 'bumblebee' ? 'bumblebee_habitat' : type + '_bee_habitat'
            ['', '_active'].each { String suffix ->
                String id=habitat+suffix
                File original=file('src/main/resources/assets/gugugaga/models/block/'+id+'.json')
                if(!original.isFile()) throw new GradleException('Missing existing habitat model '+original)
                Map model=(Map)json.parse(original)
                model.loader='fusion:model'
                model.type='fusion:base'
                model.textures.particle='gugugaga:block/fusion/'+type+'_side'
                model.textures.up='gugugaga:block/fusion/'+type+'_roof'
                ['north','south','west','east'].each { face ->
                    model.textures[face]='gugugaga:block/fusion/'+type+'_side'
                }
                putText('assets/gugugaga/models/block/'+id+'.json',model)
            }
        }
        // Optional Fusion random textures for every generated crop growth stage.
        // The base 16x16 resources remain unchanged in the mod JAR; this pack overlays
        // each texture with four related 16x16 variants in a 2x2 atlas.
        File cropSourceRoot = layout.buildDirectory.dir('generated/resources/cropAssets/assets/gugugaga/textures/block/crops').get().asFile
        List<File> cropFiles = project.fileTree(cropSourceRoot).matching { include '*.png' }.files.toList().sort { a, b -> a.name <=> b.name }
        if (cropFiles.size() != 1200)
            throw new GradleException('Expected 1200 generated crop-stage textures for Fusion overlays, found ' + cropFiles.size())
        def shadeArgb = { int argb, double factor ->
            int alpha=(argb >>> 24) & 255
            if (alpha == 0) return 0
            int red=(int)Math.max(0,Math.min(255,Math.round(((argb >>> 16) & 255) * factor)))
            int green=(int)Math.max(0,Math.min(255,Math.round(((argb >>> 8) & 255) * factor)))
            int blue=(int)Math.max(0,Math.min(255,Math.round((argb & 255) * factor)))
            (alpha << 24) | (red << 16) | (green << 8) | blue
        }
        def cropVariant = { BufferedImage source, int variant ->
            BufferedImage tile = new BufferedImage(16,16,BufferedImage.TYPE_INT_ARGB)
            boolean mirror = variant == 1 || variant == 3
            double factor = variant == 0 ? 1.0d : variant == 1 ? 1.04d : variant == 2 ? 0.90d : 1.10d
            for (int y=0;y<16;y++) for (int x=0;x<16;x++) {
                int sourceX = mirror ? 15-x : x
                tile.setRGB(x,y,(int)shadeArgb.call(source.getRGB(sourceX,y),factor))
            }
            tile
        }
        cropFiles.eachWithIndex { File sourceFile, int sourceIndex ->
            BufferedImage sourceImage = ImageIO.read(sourceFile)
            if (sourceImage == null || sourceImage.width != 16 || sourceImage.height != 16)
                throw new GradleException('Crop stage source must be 16x16: ' + sourceFile.name)
            BufferedImage atlas = new BufferedImage(32,32,BufferedImage.TYPE_INT_ARGB)
            for (int variant=0;variant<4;variant++) {
                BufferedImage tile=cropVariant.call(sourceImage,variant)
                int ox=(variant%2)*16, oy=variant.intdiv(2)*16
                for (int y=0;y<16;y++) for (int x=0;x<16;x++)
                    atlas.setRGB(ox+x,oy+y,tile.getRGB(x,y))
            }
            String texturePath='assets/gugugaga/textures/block/crops/'+sourceFile.name
            File atlasFile=new File(root,texturePath)
            atlasFile.parentFile.mkdirs()
            if(!ImageIO.write(atlas,'png',atlasFile))
                throw new GradleException('Unable to write Fusion crop atlas '+sourceFile.name)
            int textureSeed=100000+Math.floorMod(sourceFile.name.hashCode(),1800000000)
            putText(texturePath+'.mcmeta',[fusion:[
                type:'random',rows:2,columns:2,randomness_source:'position',seed:textureSeed
            ]])
        }

        // A review sheet shows four variants for twenty mature crops, without packaging the sheet.
        List<File> matureCropFiles=cropFiles.findAll { it.name.endsWith('_stage7.png') }.sort { a,b -> a.name <=> b.name }
        if(matureCropFiles.size()!=100)
            throw new GradleException('Expected 100 mature crop textures for Fusion preview, found '+matureCropFiles.size())
        BufferedImage cropProof=new BufferedImage(960,440,BufferedImage.TYPE_INT_ARGB)
        Graphics2D cropGraphics=cropProof.createGraphics()
        cropGraphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION,RenderingHints.VALUE_INTERPOLATION_NEAREST_NEIGHBOR)
        cropGraphics.setRenderingHint(RenderingHints.KEY_ANTIALIASING,RenderingHints.VALUE_ANTIALIAS_OFF)
        cropGraphics.setColor(new Color(29,34,30,255))
        cropGraphics.fillRect(0,0,cropProof.width,cropProof.height)
        cropGraphics.setFont(new Font(Font.SANS_SERIF,Font.PLAIN,10))
        for(int sample=0;sample<20;sample++) {
            int sourceIndex=(int)Math.floor(sample*(matureCropFiles.size()-1)/19.0d)
            File sourceFile=matureCropFiles[sourceIndex]
            BufferedImage sourceImage=ImageIO.read(sourceFile)
            int col=sample%4,row=(int)(sample/4),x=col*240,y=row*88
            cropGraphics.setColor(new Color(238,240,232,255))
            cropGraphics.drawString(sourceFile.name.replace('_stage7.png',''),x+4,y+12)
            for(int variant=0;variant<4;variant++) {
                BufferedImage tile=cropVariant.call(sourceImage,variant)
                cropGraphics.drawImage(tile,x+78+variant*36,y+18,32,32,null)
            }
        }
        cropGraphics.dispose()
        File report=fusionProof.get().asFile
        report.mkdirs()
        if(!ImageIO.write(cropProof,'png',new File(report,'fusion-crop-random-variants-contact-sheet.png')))
            throw new GradleException('Could not write Fusion crop variation proof sheet')
        if(!ImageIO.write(proof,'png',new File(report,'fusion-habitat-contact-sheet.png')))
            throw new GradleException('Could not write Fusion proof sheet')
        logger.lifecycle('FUSION_VISUAL_PACK_OK: 8 habitat models, 8 habitat atlases, 1200 crop-stage random atlases, 32 habitat tiles.')
    }
}
tasks.register('packageFusionVisualPack', Zip) {
    dependsOn tasks.named('generateFusionVisualPack')
    from(fusionPackRoot)
    destinationDirectory.set(layout.buildDirectory.dir('distributions'))
    archiveFileName.set('gugugaga-fusion-visuals-v2.6.zip')
}
tasks.named('assemble').configure {
    dependsOn tasks.named('packageFusionVisualPack')
}
