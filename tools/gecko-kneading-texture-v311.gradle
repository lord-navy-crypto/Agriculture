import java.awt.image.BufferedImage
import javax.imageio.ImageIO

/*
 * Build-time 64x64 atlas for the first GeckoLib workstation rig.
 * Four 16x16 tiles are used by the geo model: wood, flour, steel and dough.
 * No runtime image generation or extra dependency is introduced.
 */
def geckoTextureAssets = layout.buildDirectory.dir('generated/resources/geckoKneadingV311')
sourceSets.main.resources.srcDir(geckoTextureAssets)

tasks.register('generateGeckoKneadingTextureV311') {
    outputs.dir(geckoTextureAssets)
    doLast {
        File root = geckoTextureAssets.get().asFile
        project.delete(root)
        File texture = new File(root, 'assets/gugugaga/textures/entity/kneading_bench.png')
        texture.parentFile.mkdirs()

        BufferedImage image = new BufferedImage(64, 64, BufferedImage.TYPE_INT_ARGB)
        for (int y = 0; y < 64; y++) {
            for (int x = 0; x < 64; x++) {
                int tile = x / 16
                int lx = x % 16
                int ly = y % 16
                int rgb
                switch (tile) {
                    case 0: // Warm oak with subtle grain.
                        rgb = 0xA87843
                        if (ly % 5 == 0) rgb = 0x80542F
                        if (lx == 2 || lx == 11) rgb = 0xC39158
                        if ((lx * 7 + ly * 3) % 29 == 0) rgb = 0x69452B
                        break
                    case 1: // Flour-dusted stone / work surface.
                        rgb = 0xE5D9BD
                        if ((lx * 5 + ly * 11) % 19 == 0) rgb = 0xC5B99E
                        if ((lx + ly) % 13 == 0) rgb = 0xF4EBD8
                        break
                    case 2: // Brushed steel fittings.
                        rgb = 0x858B8B
                        if (ly % 4 == 0) rgb = 0xB8BDB9
                        if (ly % 4 == 1) rgb = 0x666D70
                        if (lx == 1 || lx == 14) rgb = 0xD2D5CE
                        break
                    default: // Pale dough with restrained flour flecks.
                        rgb = 0xD9B77E
                        if ((lx * 3 + ly * 7) % 17 == 0) rgb = 0xF0D8A5
                        if ((lx * 11 + ly * 5) % 31 == 0) rgb = 0xB99460
                        break
                }
                image.setRGB(x, y, (int)(0xFF000000L | (rgb & 0xFFFFFF)))
            }
        }
        if (!ImageIO.write(image, 'png', texture))
            throw new GradleException('Unable to generate GeckoLib kneading bench texture')
        logger.lifecycle('GECKOLIB_KNEADING_TEXTURE_V311_OK: 64x64 atlas generated.')
    }
}
tasks.named('processResources').configure {
    dependsOn tasks.named('generateGeckoKneadingTextureV311')
}
