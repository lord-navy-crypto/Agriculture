import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.awt.Color
import java.awt.Font
import java.awt.Graphics2D
import java.awt.RenderingHints
import java.awt.image.BufferedImage
import javax.imageio.ImageIO
import java.security.MessageDigest

/*
 * Deterministic crop pixel-art generator. Emits 16x16 transparent PNGs,
 * eight distinct growth stages, pollination-marked reproductive stages,
 * produce/seed icons and the matching Minecraft crop models.
 */
def cropGeneratedResources = layout.buildDirectory.dir('generated/resources/cropAssets')
sourceSets.main.resources.srcDir(cropGeneratedResources)

tasks.register('generateCropAssets') {
    inputs.files(
        file('src/main/resources/data/gugugaga/agronomy/crop_profiles_v0_4.json'),
        file('src/main/resources/data/gugugaga/agronomy/crop_additions_v0_9.json'),
        file('src/main/resources/data/gugugaga/agronomy/crop_additions_v1_0.json'),
        file('src/main/resources/data/gugugaga/agronomy/crop_additions_v1_3.json')
    )
    outputs.dir(cropGeneratedResources)
    outputs.dir(layout.buildDirectory.dir('reports/agriculture'))
    doLast {
        File outputRoot = cropGeneratedResources.get().asFile
        project.delete(outputRoot)
        outputRoot.mkdirs()
        def slurper = new JsonSlurper()
        def profileNames = ['crop_profiles_v0_4.json','crop_additions_v0_9.json','crop_additions_v1_0.json','crop_additions_v1_3.json']
        def cropProfiles = profileNames.collectMany { name ->
            slurper.parse(file('src/main/resources/data/gugugaga/agronomy/' + name)).crops
        }
        def cropIds = cropProfiles.collect { it.crop.toString() }.unique().sort()
        if (cropIds.size() != 64) throw new GradleException('Expected exactly 64 unique crop profiles, found ' + cropIds.size())
        def harvestedOrganByCrop = [:]
        cropProfiles.each { profile ->
            String crop = profile.crop.toString()
            def rawOrgan = profile.harvested_organ
            if (rawOrgan == null || rawOrgan.toString().trim().isEmpty()) {
                throw new GradleException('Crop ' + crop + ' must declare a harvested organ before item art can be generated')
            }
            harvestedOrganByCrop[crop] = rawOrgan.toString()
        }
        if (!(cropIds as Set).equals(harvestedOrganByCrop.keySet())) {
            throw new GradleException('Every crop must declare a harvested organ before item art can be generated')
        }

        def palettes = [
            corn:'#E8B932', tomato:'#D9473E', onion:'#CDB7D9', rice:'#D8C98B',
            soybean:'#91A95C', strawberry:'#D92F55', cucumber:'#4C9B4B', blueberry:'#526BC2',
            bell_pepper:'#D94A3E', garlic:'#E8E0CD', barley:'#C7A65D', oat:'#C4B37C',
            rye:'#B58D4B', pea:'#72B64D', lettuce:'#6DBB55', cabbage:'#5B9849',
            spinach:'#2D8047', broccoli:'#327D45', eggplant:'#79509B', cotton:'#EDECE2',
            flax:'#6498D1', peanut:'#B98957', sorghum:'#A9623D', sunflower_seed:'#E0B431',
            millet:'#C9A35B', buckwheat:'#A75C5A', chickpea:'#C5B58B', lentil:'#899B56',
            radish:'#D74F69', turnip:'#CDB6D9', sweet_potato:'#C67B4A', kale:'#478748',
            zucchini:'#4D9D43', raspberry:'#C83E68', cranberry:'#B82F4D', sesame:'#C6B17A',
            lavender:'#9473BD', clover:'#75A64C', basil:'#3C9755', mint:'#63B98A',
            mustard:'#D6B63B', canola:'#E5C23C', celery:'#8EBF62', leek:'#74A66C',
            parsnip:'#D8BE8A', arugula:'#4A954F', swiss_chard:'#679D50', okra:'#5C9A43',
            fennel:'#70B16B', dill:'#6AA65B', cilantro:'#4B9049', parsley:'#318847',
            collard_greens:'#4E8644', green_bean:'#5B9B45', chili_pepper:'#D73C30',
            brussels_sprouts:'#5A8D4A', cauliflower:'#D9D7C7', bok_choy:'#75B88A',
            shallot:'#A47CA5', ginger:'#C6A56C', turmeric:'#D99B22', black_bean:'#453F3D',
            quinoa:'#C5AB76', artichoke:'#678E49'
        ]
        def categoryGroups = [
            grain:'corn rice barley oat rye sorghum millet buckwheat quinoa sesame sunflower_seed'.split(' '),
            fruit:'tomato strawberry cucumber blueberry bell_pepper eggplant zucchini raspberry cranberry okra chili_pepper'.split(' '),
            root:'onion garlic peanut radish turnip sweet_potato parsnip shallot ginger turmeric fennel'.split(' '),
            leafy:'lettuce cabbage spinach broccoli kale celery leek arugula swiss_chard collard_greens brussels_sprouts cauliflower bok_choy'.split(' '),
            pod:'soybean pea chickpea lentil green_bean black_bean'.split(' '),
            flower:'lavender clover mustard canola artichoke'.split(' '),
            herb:'basil mint dill cilantro parsley'.split(' '),
            fiber:'cotton flax'.split(' ')
        ]
        def categoryByCrop = [:]
        categoryGroups.each { category, names ->
            names.each { name ->
                if (categoryByCrop.containsKey(name)) throw new GradleException('Duplicate crop art category: ' + name)
                categoryByCrop[name] = category.toString()
            }
        }
        if (!(cropIds as Set).equals(categoryByCrop.keySet())) {
            throw new GradleException('Crop art categories do not match the 64 crop profiles')
        }
        if (!(cropIds as Set).equals(palettes.keySet())) {
            throw new GradleException('Crop art palette map must cover all 64 crop IDs exactly')
        }

        // A crop's leaf architecture controls its silhouette, not just its color.
        // These groups intentionally cover every registered crop exactly once.
        def leafFormGroups = [
            blade:'corn rice barley oat rye sorghum millet buckwheat quinoa sesame flax leek'.split(' '),
            rosette:'lettuce cabbage spinach broccoli kale arugula swiss_chard collard_greens brussels_sprouts cauliflower bok_choy radish turnip strawberry'.split(' '),
            bulb:'onion garlic shallot ginger turmeric parsnip'.split(' '),
            vine:'cucumber zucchini pea green_bean sweet_potato'.split(' '),
            bush:'tomato bell_pepper eggplant blueberry raspberry cranberry soybean black_bean chickpea lentil basil mint clover cotton peanut chili_pepper okra'.split(' '),
            fern:'fennel dill cilantro parsley'.split(' '),
            flower:'lavender mustard canola sunflower_seed artichoke'.split(' '),
            stalk:'celery'.split(' ')
        ]
        def leafFormByCrop = [:]
        leafFormGroups.each { form, names ->
            names.each { name ->
                if (leafFormByCrop.containsKey(name)) throw new GradleException('Duplicate crop leaf form: ' + name)
                leafFormByCrop[name] = form.toString()
            }
        }
        if (!(cropIds as Set).equals(leafFormByCrop.keySet())) {
            throw new GradleException('Crop leaf forms must cover the 64 crop IDs exactly')
        }

        // Derive the produce icon family from the actual harvested-organ text in the data profile.
        // Unknown descriptions fail the build instead of silently receiving a plausible-looking wrong icon.
        def organFormFromProfile = { String raw ->
            String organ = raw.toLowerCase(Locale.ROOT)
                    .replace('_', ' ')
                    .replaceAll('[^a-z ]', ' ')
                    .replaceAll('\\s+', ' ')
                    .trim()
            if (organ.contains('fiber') && organ.contains('seed')) return 'fiber_seed'
            if (organ.contains('grain')) return 'grain'
            if (organ.contains('berry')) return 'berry'
            if (organ.contains('fruit pod') || organ.contains('pods') || organ.contains('pod')) return 'pod'
            if (organ.contains('fruit')) return 'fruit'
            if (organ.contains('flower head') || organ.contains('flower buds') ||
                    organ.contains('flower curd') || organ.contains('curd') ||
                    organ.contains('lateral leaf buds')) return 'head'
            if (organ.contains('bulb') || organ.contains('leaf base')) return 'bulb'
            if (organ.contains('rhizome')) return 'rhizome'
            if (organ.contains('root')) return 'root'
            if (organ.contains('fiber')) return 'fiber'
            if (organ.contains('oilseed') || organ.contains('seed')) return 'seed'
            if (organ.contains('leaf stalk') || organ.contains('pseudostem') ||
                    organ.contains('sheath')) return 'stalk'
            if (organ.contains('flower')) return 'flower'
            if (organ.contains('leaf') || organ.contains('leaves') ||
                    organ.contains('foliage') || organ.contains('petiole')) return 'leaf'
            throw new GradleException('No harvested-organ icon mapping for profile value: ' + raw)
        }
        def organFormByCrop = [:]
        cropProfiles.each { profile ->
            String crop = profile.crop.toString()
            organFormByCrop[crop] = organFormFromProfile.call(harvestedOrganByCrop[crop])
        }
        if (!(cropIds as Set).equals(organFormByCrop.keySet())) {
            throw new GradleException('Harvested-organ icon mapping must cover the 64 crop IDs exactly')
        }

        // Seed appearance is a separate botanical property: it must not be inferred from
        // the harvested organ (e.g. leafy crops still have seeds). Keep this taxonomy explicit.
        def seedFormGroups = [
            kernel:'corn rice barley oat rye sorghum millet buckwheat quinoa'.split(' '),
            legume:'soybean black_bean chickpea lentil pea green_bean peanut'.split(' '),
            oilseed:'sunflower_seed sesame mustard canola flax'.split(' '),
            nightshade:'tomato bell_pepper chili_pepper eggplant'.split(' '),
            cucurbit:'cucumber zucchini'.split(' '),
            berry:'strawberry blueberry raspberry cranberry'.split(' '),
            brassica:'cabbage broccoli kale brussels_sprouts cauliflower bok_choy collard_greens arugula'.split(' '),
            allium:'onion garlic shallot leek'.split(' '),
            root:'radish turnip parsnip sweet_potato'.split(' '),
            herb:'basil mint lavender dill cilantro parsley fennel clover'.split(' '),
            rhizome:'ginger turmeric'.split(' '),
            fiber:['cotton'],
            flower:['artichoke'],
            stalk:['celery'],
            leafy:'lettuce spinach swiss_chard'.split(' '),
            capsule:['okra']
        ]
        def seedFormByCrop = [:]
        seedFormGroups.each { form, names ->
            names.each { name ->
                if (seedFormByCrop.containsKey(name)) throw new GradleException('Duplicate crop seed icon form: ' + name)
                seedFormByCrop[name] = form.toString()
            }
        }
        if (!(cropIds as Set).equals(seedFormByCrop.keySet())) {
            throw new GradleException('Seed icon forms must cover the 64 crop IDs exactly')
        }

        def rgb = { String value -> Integer.parseInt(value.substring(1), 16) }
        def shade = { int color, double factor ->
            int red = (int)Math.max(0, Math.min(255, Math.round(((color >> 16) & 255) * factor)))
            int green = (int)Math.max(0, Math.min(255, Math.round(((color >> 8) & 255) * factor)))
            int blue = (int)Math.max(0, Math.min(255, Math.round((color & 255) * factor)))
            (red << 16) | (green << 8) | blue
        }
        def put = { BufferedImage image, int x, int y, int color ->
            if (x >= 0 && x < 16 && y >= 0 && y < 16) image.setRGB(x, y, (int)(0xFF000000L | (color & 0x00FFFFFF)))
        }
        def line = { BufferedImage image, int x0, int y0, int x1, int y1, int color ->
            int dx = Math.abs(x1 - x0)
            int sx = x0 < x1 ? 1 : -1
            int dy = -Math.abs(y1 - y0)
            int sy = y0 < y1 ? 1 : -1
            int err = dx + dy
            while (true) {
                put.call(image, x0, y0, color)
                if (x0 == x1 && y0 == y1) break
                int e2 = 2 * err
                if (e2 >= dy) { err += dy; x0 += sx }
                if (e2 <= dx) { err += dx; y0 += sy }
            }
        }
        def disc = { BufferedImage image, int cx, int cy, int rx, int ry, int color ->
            for (int y = cy - ry; y <= cy + ry; y++) {
                for (int x = cx - rx; x <= cx + rx; x++) {
                    double dx = (x - cx) / (double)Math.max(1, rx)
                    double dy = (y - cy) / (double)Math.max(1, ry)
                    if (dx * dx + dy * dy <= 1.05d) put.call(image, x, y, color)
                }
            }
        }
        def savePng = { String relativePath, BufferedImage image ->
            File target = new File(outputRoot, relativePath)
            target.parentFile.mkdirs()
            if (!ImageIO.write(image, 'png', target)) throw new GradleException('Unable to encode PNG: ' + relativePath)
        }
        def saveJson = { String relativePath, Object value ->
            File target = new File(outputRoot, relativePath)
            target.parentFile.mkdirs()
            target.setText(JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n', 'UTF-8')
        }


        /*
         * Species-specific morphology pass. The category silhouette is only the base;
         * these crop-ID keyed marks distinguish the harvested organ and growth habit.
         * This intentionally stays 16x16 pixel art so it packs into Minecraft's atlas.
         */
        def cropSpecificStageDetail = { BufferedImage image, String crop, int stage, int top, int accent, int leaf, int leafDark, int leafLight ->
            int cream = rgb.call('#E7D8B8')
            int white = rgb.call('#F3F0E5')
            int yellow = rgb.call('#F2CF4A')
            int red = rgb.call('#C93B43')
            int purple = rgb.call('#76509A')
            if (stage < 3) {
                // Seedling silhouettes are still small, but their cotyledon direction and
                // accent pixels are crop-specific instead of recolored vanilla wheat.
                switch (crop) {
                    case 'corn': put.call(image, 5, 13, yellow); put.call(image, 9, 13, leafLight); break
                    case 'rice': put.call(image, 6, 12, leafLight); put.call(image, 8, 13, leaf); break
                    case 'barley': put.call(image, 5, 12, cream); put.call(image, 9, 13, cream); break
                    case 'oat': put.call(image, 6, 13, cream); put.call(image, 9, 12, leafLight); break
                    case 'rye': put.call(image, 5, 13, shade.call(accent, 0.9d)); put.call(image, 9, 12, accent); break
                    case 'sorghum': put.call(image, 5, 12, accent); put.call(image, 9, 13, accent); break
                    case 'millet': put.call(image, 6, 13, yellow); put.call(image, 8, 12, yellow); break
                    case 'buckwheat': put.call(image, 5, 13, accent); put.call(image, 9, 13, shade.call(accent, 0.8d)); break
                    case 'quinoa': put.call(image, 5, 12, cream); put.call(image, 9, 12, accent); break
                    case 'sesame': put.call(image, 6, 13, cream); put.call(image, 8, 13, cream); break
                    case 'sunflower_seed': put.call(image, 6, 12, yellow); put.call(image, 8, 12, yellow); break
                    case 'tomato': put.call(image, 5, 13, leafLight); put.call(image, 9, 13, leaf); break
                    case 'strawberry': put.call(image, 5, 13, red); put.call(image, 9, 13, red); break
                    case 'cucumber': put.call(image, 5, 13, leafDark); put.call(image, 9, 13, leafLight); break
                    case 'blueberry': put.call(image, 5, 13, rgb.call('#526BC2')); put.call(image, 9, 13, rgb.call('#526BC2')); break
                    case 'bell_pepper': put.call(image, 5, 13, red); put.call(image, 9, 13, red); break
                    case 'eggplant': put.call(image, 5, 13, purple); put.call(image, 9, 13, purple); break
                    case 'zucchini': put.call(image, 5, 13, leafDark); put.call(image, 9, 13, leafLight); break
                    case 'raspberry': put.call(image, 5, 13, red); put.call(image, 9, 13, shade.call(red, 0.8d)); break
                    case 'cranberry': put.call(image, 5, 13, rgb.call('#B82F4D')); put.call(image, 9, 13, rgb.call('#B82F4D')); break
                    case 'okra': put.call(image, 5, 13, leafLight); put.call(image, 9, 13, leafDark); break
                    case 'chili_pepper': put.call(image, 5, 13, red); put.call(image, 9, 13, red); break
                    case 'onion': put.call(image, 6, 13, cream); put.call(image, 8, 13, cream); break
                    case 'garlic': put.call(image, 6, 13, white); put.call(image, 8, 13, white); break
                    case 'peanut': put.call(image, 5, 13, rgb.call('#B98957')); put.call(image, 9, 13, rgb.call('#B98957')); break
                    case 'radish': put.call(image, 5, 13, red); put.call(image, 9, 13, white); break
                    case 'turnip': put.call(image, 5, 13, purple); put.call(image, 9, 13, white); break
                    case 'sweet_potato': put.call(image, 5, 13, rgb.call('#C67B4A')); put.call(image, 9, 13, rgb.call('#C67B4A')); break
                    case 'parsnip': put.call(image, 6, 13, cream); put.call(image, 8, 13, cream); break
                    case 'shallot': put.call(image, 5, 13, purple); put.call(image, 9, 13, purple); break
                    case 'ginger': put.call(image, 5, 13, cream); put.call(image, 9, 13, rgb.call('#C6A56C')); break
                    case 'turmeric': put.call(image, 5, 13, yellow); put.call(image, 9, 13, rgb.call('#D99B22')); break
                    case 'fennel': put.call(image, 6, 13, cream); put.call(image, 8, 13, leafLight); break
                    case 'lettuce': put.call(image, 5, 13, leafLight); put.call(image, 9, 13, leafLight); break
                    case 'cabbage': put.call(image, 5, 13, leaf); put.call(image, 9, 13, leaf); break
                    case 'spinach': put.call(image, 5, 13, leafDark); put.call(image, 9, 13, leafLight); break
                    case 'broccoli': put.call(image, 5, 13, leafDark); put.call(image, 9, 13, leafDark); break
                    case 'kale': put.call(image, 5, 13, leafLight); put.call(image, 9, 13, leafDark); break
                    case 'celery': put.call(image, 6, 13, cream); put.call(image, 8, 13, cream); break
                    case 'leek': put.call(image, 6, 13, white); put.call(image, 8, 13, leafDark); break
                    case 'arugula': put.call(image, 5, 13, leaf); put.call(image, 9, 13, leafLight); break
                    case 'swiss_chard': put.call(image, 6, 13, red); put.call(image, 8, 13, red); break
                    case 'collard_greens': put.call(image, 5, 13, leafDark); put.call(image, 9, 13, leafLight); break
                    case 'brussels_sprouts': put.call(image, 6, 13, leafLight); put.call(image, 8, 13, leafLight); break
                    case 'cauliflower': put.call(image, 6, 13, white); put.call(image, 8, 13, white); break
                    case 'bok_choy': put.call(image, 6, 13, white); put.call(image, 8, 13, leafLight); break
                    case 'soybean': put.call(image, 5, 13, leafLight); put.call(image, 9, 13, accent); break
                    case 'pea': put.call(image, 5, 13, leafLight); put.call(image, 9, 13, leafLight); break
                    case 'chickpea': put.call(image, 5, 13, cream); put.call(image, 9, 13, cream); break
                    case 'lentil': put.call(image, 5, 13, accent); put.call(image, 9, 13, accent); break
                    case 'green_bean': put.call(image, 5, 13, leafDark); put.call(image, 9, 13, leafLight); break
                    case 'black_bean': put.call(image, 5, 13, rgb.call('#453F3D')); put.call(image, 9, 13, rgb.call('#453F3D')); break
                    case 'lavender': put.call(image, 6, 12, purple); put.call(image, 8, 13, purple); break
                    case 'clover': put.call(image, 5, 13, leafLight); put.call(image, 9, 13, leafLight); break
                    case 'mustard': put.call(image, 6, 12, yellow); put.call(image, 8, 13, yellow); break
                    case 'canola': put.call(image, 5, 12, yellow); put.call(image, 9, 13, yellow); break
                    case 'artichoke': put.call(image, 6, 12, leafDark); put.call(image, 8, 13, leafDark); break
                    case 'basil': put.call(image, 5, 13, leafLight); put.call(image, 9, 13, leafLight); break
                    case 'mint': put.call(image, 5, 13, leaf); put.call(image, 9, 13, leaf); break
                    case 'dill': put.call(image, 6, 12, leafLight); put.call(image, 8, 13, leafLight); break
                    case 'cilantro': put.call(image, 5, 13, leafLight); put.call(image, 9, 13, leafDark); break
                    case 'parsley': put.call(image, 5, 13, leafDark); put.call(image, 9, 13, leaf); break
                    case 'cotton': put.call(image, 6, 12, white); put.call(image, 8, 13, white); break
                    case 'flax': put.call(image, 6, 12, rgb.call('#79A9E4')); put.call(image, 8, 13, rgb.call('#79A9E4')); break
                }
            } else {
                switch (crop) {
                    case 'corn':
                        if (stage >= 3) { line.call(image, 5, 11, 3, 8, leafLight); line.call(image, 9, 10, 12, 7, leaf) }
                        if (stage >= 4) { line.call(image, 5, 10, 5, 13, accent); line.call(image, 6, 10, 6, 13, yellow); for (int y=10; y<=13; y++) put.call(image, 5 + (y % 2), y, yellow) }
                        break
                    case 'tomato':
                        if (stage >= 5) { disc.call(image, 4, 11, 2, 2, accent); disc.call(image, 10, 10, 2, 2, shade.call(accent,0.9d)); put.call(image,4,8,leaf); put.call(image,3,9,leafDark); put.call(image,5,9,leafLight); put.call(image,10,7,leaf); put.call(image,9,8,leafDark); put.call(image,11,8,leafLight) }
                        break
                    case 'onion':
                        if (stage >= 5) { disc.call(image,7,13,2,2,accent); put.call(image,6,12,shade.call(accent,1.15d)); put.call(image,7,15,cream); line.call(image,6,12,6,9,leafLight); line.call(image,8,12,9,8,leaf) }
                        break
                    case 'rice':
                        if (stage >= 4) { line.call(image,7,7,10,9,accent); line.call(image,10,9,12,11,accent); put.call(image,11,10,yellow); put.call(image,12,11,cream); put.call(image,9,8,yellow); put.call(image,10,10,cream) }
                        break
                    case 'soybean':
                        if (stage >= 4) { disc.call(image,4,10,1,2,accent); disc.call(image,10,8,1,2,shade.call(accent,0.9d)); put.call(image,4,9,leafLight); put.call(image,10,7,leafLight); put.call(image,5,11,leafDark) }
                        break
                    case 'strawberry':
                        if (stage >= 5) { disc.call(image,5,11,2,3,accent); put.call(image,5,8,leaf); put.call(image,4,9,leafLight); put.call(image,6,9,leaf); put.call(image,4,11,white); put.call(image,5,12,white); put.call(image,6,11,white) }
                        break
                    case 'cucumber':
                        if (stage >= 5) { line.call(image,3,11,6,13,accent); line.call(image,6,13,10,10,accent); line.call(image,4,11,7,13,leafLight); put.call(image,5,12,leafDark); put.call(image,8,11,leafDark); put.call(image,10,9,leaf) }
                        break
                    case 'blueberry':
                        if (stage >= 5) { disc.call(image,4,11,1,1,accent); disc.call(image,7,9,1,1,shade.call(accent,0.75d)); disc.call(image,10,11,1,1,accent); put.call(image,4,10,white); put.call(image,7,8,white); put.call(image,10,10,white) }
                        break
                    case 'bell_pepper':
                        if (stage >= 5) { disc.call(image,5,11,2,3,accent); disc.call(image,9,11,2,3,shade.call(accent,0.9d)); put.call(image,5,8,leaf); put.call(image,6,9,leafDark); put.call(image,9,8,leaf); put.call(image,8,9,leafDark) }
                        break
                    case 'garlic':
                        if (stage >= 5) { disc.call(image,7,13,2,2,white); put.call(image,6,12,cream); put.call(image,8,12,cream); put.call(image,7,14,shade.call(cream,0.9d)); line.call(image,7,11,7,8,leafLight) }
                        break
                    case 'barley':
                        if (stage >= 4) { for (int y=4; y<=8; y++) { put.call(image,7,y,accent); line.call(image,7,y,5,y-2,cream); line.call(image,7,y,9,y-2,cream) } }
                        break
                    case 'oat':
                        if (stage >= 4) { line.call(image,7,7,5,5,accent); line.call(image,7,7,10,4,accent); put.call(image,5,5,cream); put.call(image,10,4,cream); put.call(image,4,6,accent); put.call(image,11,5,accent) }
                        break
                    case 'rye':
                        if (stage >= 4) { for (int y=4; y<=9; y++) { put.call(image,7,y,accent); put.call(image,6,y,shade.call(accent,0.85d)); put.call(image,8,y,shade.call(accent,1.1d)) } }
                        break
                    case 'pea':
                        if (stage >= 4) { line.call(image,4,11,10,7,leafLight); disc.call(image,5,10,1,1,leafDark); disc.call(image,7,9,1,1,leafDark); disc.call(image,9,8,1,1,leafDark) }
                        break
                    case 'lettuce':
                        if (stage >= 3) { disc.call(image,4,11,2,2,leafLight); disc.call(image,10,11,2,2,leaf); disc.call(image,7,9,3,2,leafLight); put.call(image,7,8,leafDark) }
                        break
                    case 'cabbage':
                        if (stage >= 4) { disc.call(image,7,9,3,3,leafLight); disc.call(image,7,9,2,2,leaf); line.call(image,4,10,6,8,cream); line.call(image,10,10,8,8,cream) }
                        break
                    case 'spinach':
                        if (stage >= 3) { line.call(image,7,12,4,7,leafLight); line.call(image,4,7,6,8,leaf); line.call(image,7,12,11,6,leafLight); line.call(image,11,6,9,8,leaf); put.call(image,4,7,leafDark); put.call(image,11,6,leafDark) }
                        break
                    case 'broccoli':
                        if (stage >= 5) { disc.call(image,5,7,2,2,leafDark); disc.call(image,8,6,2,2,leaf); disc.call(image,11,7,2,2,leafDark); put.call(image,8,5,leafLight) }
                        break
                    case 'eggplant':
                        if (stage >= 5) { line.call(image,4,12,8,8,accent); line.call(image,5,13,9,9,shade.call(accent,0.8d)); put.call(image,8,7,leaf); put.call(image,9,7,leafDark); put.call(image,7,8,leafLight) }
                        break
                    case 'cotton':
                        if (stage >= 5) { disc.call(image,5,8,2,2,white); disc.call(image,9,8,2,2,white); put.call(image,5,7,cream); put.call(image,9,7,cream); put.call(image,7,10,shade.call(accent,0.9d)) }
                        break
                    case 'flax':
                        if (stage >= 4) { disc.call(image,5,5,1,1,rgb.call('#79A9E4')); disc.call(image,8,4,1,1,rgb.call('#79A9E4')); disc.call(image,10,6,1,1,rgb.call('#79A9E4')); put.call(image,5,4,white); put.call(image,8,3,white) }
                        break
                    case 'peanut':
                        if (stage >= 5) { line.call(image,4,13,6,11,accent); line.call(image,6,11,9,12,accent); put.call(image,5,12,cream); put.call(image,7,11,cream); put.call(image,9,12,shade.call(accent,0.8d)) }
                        break
                    case 'sorghum':
                        if (stage >= 4) { disc.call(image,7,5,2,3,accent); put.call(image,6,4,shade.call(accent,1.15d)); put.call(image,8,5,shade.call(accent,0.8d)); put.call(image,7,7,accent) }
                        break
                    case 'sunflower_seed':
                        if (stage >= 4) { disc.call(image,7,5,2,2,accent); put.call(image,7,5,shade.call(accent,0.65d)); for (int x : [4,5,9,10]) put.call(image,x,5,yellow); put.call(image,7,2,yellow); put.call(image,7,8,yellow) }
                        break
                    case 'millet':
                        if (stage >= 4) { disc.call(image,7,5,2,2,accent); put.call(image,6,4,cream); put.call(image,8,5,shade.call(accent,0.8d)); put.call(image,7,6,cream) }
                        break
                    case 'buckwheat':
                        if (stage >= 4) { put.call(image,6,5,accent); put.call(image,7,4,accent); put.call(image,8,5,accent); put.call(image,6,7,shade.call(accent,0.8d)); put.call(image,8,7,cream) }
                        break
                    case 'chickpea':
                        if (stage >= 4) { disc.call(image,4,10,1,2,cream); disc.call(image,10,8,1,2,cream); put.call(image,4,9,accent); put.call(image,10,7,accent) }
                        break
                    case 'lentil':
                        if (stage >= 4) { disc.call(image,5,10,2,1,accent); disc.call(image,9,8,2,1,shade.call(accent,0.8d)); put.call(image,5,10,cream); put.call(image,9,8,cream) }
                        break
                    case 'radish':
                        if (stage >= 5) { disc.call(image,7,13,2,2,accent); line.call(image,7,14,7,15,white); line.call(image,7,11,5,8,leafLight) }
                        break
                    case 'turnip':
                        if (stage >= 5) { disc.call(image,7,13,2,2,white); put.call(image,6,12,purple); put.call(image,7,12,purple); line.call(image,7,14,7,15,cream) }
                        break
                    case 'sweet_potato':
                        if (stage >= 5) { line.call(image,4,13,7,11,accent); line.call(image,7,11,11,13,shade.call(accent,0.8d)); put.call(image,5,12,shade.call(accent,1.2d)); put.call(image,9,12,accent) }
                        break
                    case 'kale':
                        if (stage >= 3) { for (int x : [3,5,9,11]) { put.call(image,x,9,leafDark); put.call(image,x,11,leafLight) }; put.call(image,4,8,leafLight); put.call(image,10,8,leafLight) }
                        break
                    case 'zucchini':
                        if (stage >= 5) { line.call(image,3,11,6,13,accent); line.call(image,6,13,11,9,accent); put.call(image,5,12,leafLight); put.call(image,8,11,leafDark); put.call(image,10,9,leafLight) }
                        break
                    case 'raspberry':
                        if (stage >= 5) { for (int[] pt : [[4,10],[5,9],[6,10],[5,11],[9,9],[10,10],[9,11]] as int[][]) disc.call(image,pt[0],pt[1],1,1,accent); put.call(image,4,9,white); put.call(image,9,8,white) }
                        break
                    case 'cranberry':
                        if (stage >= 5) { disc.call(image,4,11,1,1,accent); disc.call(image,7,10,1,1,shade.call(accent,0.8d)); disc.call(image,10,11,1,1,accent); put.call(image,4,10,white); put.call(image,10,10,white) }
                        break
                    case 'sesame':
                        if (stage >= 4) { line.call(image,5,8,5,11,accent); line.call(image,9,6,9,9,accent); put.call(image,4,9,cream); put.call(image,6,10,cream); put.call(image,8,7,cream); put.call(image,10,8,cream) }
                        break
                    case 'lavender':
                        if (stage >= 3) { for (int y=3; y<=7; y++) { if (y % 2 == 1) put.call(image,6,y,purple); put.call(image,8,y,shade.call(purple,1.1d)) }; put.call(image,7,2,purple) }
                        break
                    case 'clover':
                        if (stage >= 3) { disc.call(image,5,9,1,1,leafLight); disc.call(image,9,9,1,1,leafLight); disc.call(image,7,7,1,1,leafLight); disc.call(image,7,5,1,1,white); put.call(image,7,5,accent) }
                        break
                    case 'basil':
                        if (stage >= 3) { disc.call(image,5,8,2,1,leafLight); disc.call(image,10,8,2,1,leaf); put.call(image,5,8,leafDark); put.call(image,10,8,leafDark) }
                        break
                    case 'mint':
                        if (stage >= 3) { for (int y : [6,9,12]) { put.call(image,4,y,leafLight); put.call(image,5,y-1,leaf); put.call(image,10,y,leafLight); put.call(image,9,y-1,leaf) } }
                        break
                    case 'mustard':
                        if (stage >= 3) { for (int[] pt : [[5,5],[8,4],[10,6],[6,7]] as int[][]) disc.call(image,pt[0],pt[1],1,1,yellow); put.call(image,5,4,cream); put.call(image,10,5,cream) }
                        break
                    case 'canola':
                        if (stage >= 3) { disc.call(image,5,5,1,1,yellow); disc.call(image,8,4,1,1,yellow); disc.call(image,10,6,1,1,yellow); disc.call(image,7,7,1,1,yellow) }
                        break
                    case 'celery':
                        if (stage >= 3) { line.call(image,5,14,5,7,cream); line.call(image,7,14,7,5,leafLight); line.call(image,9,14,9,8,cream); put.call(image,5,7,leaf); put.call(image,9,8,leaf) }
                        break
                    case 'leek':
                        if (stage >= 3) { line.call(image,5,14,4,4,leafDark); line.call(image,7,14,7,2,leafLight); line.call(image,9,14,11,4,leaf); line.call(image,6,15,8,15,white) }
                        break
                    case 'parsnip':
                        if (stage >= 5) { line.call(image,7,11,6,15,cream); line.call(image,7,11,8,14,white); put.call(image,6,12,shade.call(cream,0.9d)); line.call(image,7,11,5,8,leafLight) }
                        break
                    case 'arugula':
                        if (stage >= 3) { line.call(image,7,13,4,7,leafLight); put.call(image,4,8,leafDark); put.call(image,5,9,leaf); put.call(image,10,7,leafLight); put.call(image,9,8,leafDark); put.call(image,8,10,leaf) }
                        break
                    case 'swiss_chard':
                        if (stage >= 3) { line.call(image,5,14,5,7,red); line.call(image,9,14,9,6,rgb.call('#D5B9B4')); line.call(image,5,8,3,5,leafLight); line.call(image,9,7,12,4,leaf) }
                        break
                    case 'okra':
                        if (stage >= 5) { line.call(image,4,12,7,7,leafLight); line.call(image,5,12,8,7,accent); line.call(image,6,12,9,7,leafDark); put.call(image,7,6,leaf) }
                        break
                    case 'fennel':
                        if (stage >= 3) { disc.call(image,7,13,2,2,cream); for (int x : [4,6,8,10]) { line.call(image,7,7,x,4,leafLight); put.call(image,x,4,leaf) } }
                        break
                    case 'dill':
                        if (stage >= 3) { for (int y : [5,7,9]) { line.call(image,7,y,4,y-2,leafLight); line.call(image,7,y,10,y-2,leafLight); put.call(image,4,y-2,leaf); put.call(image,10,y-2,leaf) } }
                        break
                    case 'cilantro':
                        if (stage >= 3) { line.call(image,7,12,4,7,leafLight); line.call(image,4,7,3,5,leaf); line.call(image,4,7,6,6,leaf); line.call(image,7,12,11,6,leafLight); line.call(image,11,6,10,4,leaf) }
                        break
                    case 'parsley':
                        if (stage >= 3) { for (int[] pt : [[4,7],[6,5],[9,6],[11,8],[6,10],[9,11]] as int[][]) { put.call(image,pt[0],pt[1],leafLight); put.call(image,pt[0]+1,pt[1],leafDark) } }
                        break
                    case 'collard_greens':
                        if (stage >= 3) { disc.call(image,4,9,2,3,leaf); disc.call(image,10,8,2,3,leafLight); line.call(image,4,12,6,8,leafDark); line.call(image,10,11,8,7,leafDark) }
                        break
                    case 'green_bean':
                        if (stage >= 4) { line.call(image,4,12,10,6,leafLight); line.call(image,5,13,11,7,leafDark); put.call(image,6,10,accent); put.call(image,8,8,accent); put.call(image,10,6,accent) }
                        break
                    case 'chili_pepper':
                        if (stage >= 5) { line.call(image,5,8,8,11,accent); line.call(image,8,11,11,12,accent); put.call(image,11,12,red); put.call(image,5,7,leaf); put.call(image,6,8,leafDark) }
                        break
                    case 'brussels_sprouts':
                        if (stage >= 4) { for (int[] pt : [[4,9],[10,8],[5,12],[9,12]] as int[][]) disc.call(image,pt[0],pt[1],1,1,leafLight); put.call(image,4,8,leafDark); put.call(image,10,7,leafDark) }
                        break
                    case 'cauliflower':
                        if (stage >= 5) { disc.call(image,5,7,2,2,white); disc.call(image,8,6,2,2,cream); disc.call(image,10,8,2,2,white); put.call(image,7,5,white) }
                        break
                    case 'bok_choy':
                        if (stage >= 3) { line.call(image,5,14,5,8,white); line.call(image,7,14,7,7,cream); line.call(image,9,14,9,8,white); line.call(image,5,8,3,5,leaf); line.call(image,9,8,12,5,leafLight) }
                        break
                    case 'shallot':
                        if (stage >= 5) { disc.call(image,7,13,2,2,purple); put.call(image,6,12,shade.call(purple,1.2d)); put.call(image,8,12,purple); line.call(image,7,11,7,8,leafLight) }
                        break
                    case 'ginger':
                        if (stage >= 5) { line.call(image,4,13,6,11,cream); line.call(image,6,11,8,12,accent); line.call(image,8,12,11,10,cream); put.call(image,6,12,shade.call(accent,0.8d)); put.call(image,9,11,shade.call(accent,0.8d)) }
                        break
                    case 'turmeric':
                        if (stage >= 5) { line.call(image,4,13,6,11,accent); line.call(image,6,11,8,12,shade.call(accent,0.9d)); line.call(image,8,12,11,10,accent); put.call(image,6,12,yellow); put.call(image,9,11,yellow) }
                        break
                    case 'black_bean':
                        if (stage >= 4) { line.call(image,4,11,10,7,leafDark); disc.call(image,5,10,1,1,rgb.call('#453F3D')); disc.call(image,8,8,1,1,rgb.call('#453F3D')); put.call(image,5,9,cream); put.call(image,8,7,cream) }
                        break
                    case 'quinoa':
                        if (stage >= 4) { for (int y : [4,6,8]) { put.call(image,6,y,accent); put.call(image,8,y-1,cream); put.call(image,9,y+1,shade.call(accent,0.8d)) } }
                        break
                    case 'artichoke':
                        if (stage >= 4) { line.call(image,7,7,5,4,leafDark); line.call(image,7,7,9,4,leafDark); line.call(image,7,7,7,3,leafLight); disc.call(image,7,6,2,2,accent); put.call(image,7,4,leafLight) }
                        break
                }
            }
            image
        }

        def stageTexture = { String crop, int stage, boolean pollinated ->
            BufferedImage image = new BufferedImage(16, 16, BufferedImage.TYPE_INT_ARGB)
            int accent = rgb.call(palettes[crop].toString())
            int stem = rgb.call('#36763A')
            int leaf = rgb.call('#4E9845')
            int leafDark = rgb.call('#2D6B35')
            int leafLight = rgb.call('#82C35A')
            int pollen = rgb.call('#F4E6A2')
            int flowerCore = rgb.call('#F1C84A')
            String kind = categoryByCrop[crop].toString()
            String leafForm = leafFormByCrop[crop].toString()
            int maxHeight = leafForm in ['rosette', 'bulb', 'stalk'] ? 10 :
                            leafForm in ['vine', 'fern'] ? 12 :
                            leafForm == 'bush' ? 13 : 14
            int height = (int)(3 + Math.floor(stage * (maxHeight - 3) / 7.0d))
            int top = 15 - height
            line.call(image, 7, 15, 7, top, stem)
            // A tiny crop-specific seed/cotyledon pixel keeps even the earliest seedling sprite unique.
            put.call(image, 5, 15, shade.call(accent, 0.72d))
            if (stage >= 3 && (kind == 'leafy' || kind == 'herb' || kind == 'fiber')) {
                line.call(image, 7, 13, 5, Math.max(top + 2, 7), stem)
                line.call(image, 7, 13, 10, Math.max(top + 3, 8), stem)
            }
            int nodes = Math.min(6, stage + 1)
            for (int node = 0; node < nodes; node++) {
                int y = 14 - node * 2
                if (y < top + 1) continue
                int side = node % 2 == 0 ? -1 : 1
                if (leafForm == 'blade') {
                    int bladeLength = Math.min(4, 1 + stage.intdiv(2))
                    int bladeTipY = Math.max(top + 1, y - 2)
                    line.call(image, 7, y, Math.max(1, 7 - bladeLength), bladeTipY, leafLight)
                    line.call(image, 7, y, Math.min(14, 7 + bladeLength), Math.max(top + 1, y - 1), leaf)
                    put.call(image, Math.max(1, 7 - bladeLength), bladeTipY, leafLight)
                    put.call(image, Math.min(14, 7 + bladeLength), Math.max(top + 1, y - 1), leafDark)
                } else if (leafForm == 'rosette') {
                    int rosetteSpread = Math.min(4, 1 + stage.intdiv(2))
                    int rosetteRadius = stage >= 5 ? 2 : 1
                    disc.call(image, Math.max(1, 7 - rosetteSpread), y, rosetteRadius, 1, leaf)
                    disc.call(image, Math.min(14, 7 + rosetteSpread), Math.max(top + 1, y - 1), rosetteRadius, 1, leafLight)
                    line.call(image, Math.max(1, 7 - rosetteSpread), y, 7, Math.max(top + 1, y - 1), leafDark)
                    line.call(image, 7, Math.max(top + 1, y - 1), Math.min(14, 7 + rosetteSpread), Math.max(top + 1, y - 1), leafDark)
                } else if (leafForm == 'bulb') {
                    int bladeLength = Math.min(4, 1 + stage.intdiv(2))
                    line.call(image, 7, y, Math.max(2, 7 - bladeLength), Math.max(top + 1, y - 3), leafLight)
                    line.call(image, 7, y, Math.min(13, 7 + bladeLength), Math.max(top + 1, y - 2), leaf)
                    put.call(image, Math.max(2, 7 - bladeLength), Math.max(top + 1, y - 3), leafDark)
                    put.call(image, Math.min(13, 7 + bladeLength), Math.max(top + 1, y - 2), leafLight)
                } else if (leafForm == 'vine') {
                    int vineReach = Math.min(4, 1 + stage.intdiv(2))
                    int vineX = Math.max(1, Math.min(14, 7 + side * vineReach))
                    line.call(image, 7, y, vineX, Math.max(top + 1, y - 2), leafDark)
                    disc.call(image, vineX, Math.max(top + 1, y - 2), stage >= 6 ? 2 : 1, 1, leafLight)
                    line.call(image, vineX, Math.max(top + 1, y - 2), Math.max(1, Math.min(14, vineX - side * 2)), Math.max(top + 1, y - 3), leaf)
                    put.call(image, Math.max(1, Math.min(14, vineX - side * 2)), Math.max(top + 1, y - 3), leafDark)
                } else if (leafForm == 'bush') {
                    int bushReach = Math.min(4, 1 + stage.intdiv(2))
                    int leftX = Math.max(1, 7 - bushReach)
                    int rightX = Math.min(14, 7 + bushReach)
                    line.call(image, 7, y, leftX, Math.max(top + 1, y - 1), leafDark)
                    line.call(image, 7, y, rightX, Math.max(top + 1, y - 1), leafDark)
                    disc.call(image, leftX, Math.max(top + 1, y - 1), stage >= 5 ? 2 : 1, 1, leafLight)
                    disc.call(image, rightX, Math.max(top + 1, y - 1), stage >= 5 ? 2 : 1, 1, leaf)
                    put.call(image, Math.max(1, leftX - 1), Math.max(top + 1, y - 2), leafDark)
                    put.call(image, Math.min(14, rightX + 1), Math.max(top + 1, y - 2), leafLight)
                } else if (leafForm == 'fern') {
                    int leafletCount = Math.min(3, 1 + stage.intdiv(3))
                    for (int leaflet = 1; leaflet <= leafletCount; leaflet++) {
                        int leafletY = Math.max(top + 1, y - leaflet)
                        int leftX = Math.max(1, 7 - leaflet * 2)
                        int rightX = Math.min(14, 7 + leaflet * 2)
                        line.call(image, 7, y, leftX, leafletY, leafLight)
                        line.call(image, 7, y, rightX, leafletY, leaf)
                        put.call(image, leftX, leafletY, leafDark)
                        put.call(image, rightX, leafletY, leafLight)
                    }
                } else if (leafForm == 'flower') {
                    int flowerLeafReach = Math.min(3, 1 + stage.intdiv(3))
                    line.call(image, 7, y, Math.max(2, 7 - flowerLeafReach), Math.max(top + 1, y - 2), leaf)
                    line.call(image, 7, y, Math.min(13, 7 + flowerLeafReach), Math.max(top + 1, y - 1), leafLight)
                    put.call(image, Math.max(2, 7 - flowerLeafReach), Math.max(top + 1, y - 2), leafDark)
                    put.call(image, Math.min(13, 7 + flowerLeafReach), Math.max(top + 1, y - 1), leaf)
                } else { // celery: ribbed, upright petioles rather than generic paired leaves
                    int stalkReach = Math.min(3, 1 + stage.intdiv(3))
                    line.call(image, 7, y, Math.max(4, 7 - stalkReach), Math.max(top + 1, y - 3), leafLight)
                    line.call(image, 7, y, Math.min(10, 7 + stalkReach), Math.max(top + 1, y - 3), leafLight)
                    put.call(image, 6, y, leafDark)
                    put.call(image, 8, y, leafDark)
                }
                put.call(image, 7, y, stem)
            }
            if (kind == 'grain' && stage >= 4) {
                for (int row = 0; row < Math.min(5, stage - 2); row++) {
                    put.call(image, 6, top + row, shade.call(accent, 0.82d))
                    put.call(image, 8, top + row, accent)
                    if (row < stage - 3) put.call(image, 7, top + row, shade.call(accent, 1.08d))
                }
            }
            if (kind == 'fruit' && stage >= 5) {
                if (['cucumber', 'zucchini', 'okra', 'chili_pepper', 'eggplant'].contains(crop)) {
                    line.call(image, 4, 10, 5, 13, accent)
                    line.call(image, 10, 8, 11, 11, shade.call(accent, 0.9d))
                    put.call(image, 4, 11, shade.call(accent, 1.18d))
                    put.call(image, 10, 9, shade.call(accent, 1.18d))
                } else if (['strawberry', 'blueberry', 'raspberry', 'cranberry'].contains(crop)) {
                    disc.call(image, 4, 11, 2, 2, accent)
                    disc.call(image, 10, 10, 2, 2, shade.call(accent, 0.88d))
                    put.call(image, 4, 9, leaf)
                    put.call(image, 10, 8, leaf)
                    put.call(image, 3, 11, shade.call(accent, 1.2d))
                } else {
                    disc.call(image, 4, 10, 2, 2, accent)
                    disc.call(image, 10, 10, 2, 2, shade.call(accent, 0.9d))
                    put.call(image, 4, 8, leaf)
                    put.call(image, 10, 8, leaf)
                    put.call(image, 5, 10, shade.call(accent, 1.2d))
                }
            }
            if (kind == 'pod' && stage >= 4) {
                int podColor = crop in ['pea', 'green_bean'] ? leafLight : accent
                line.call(image, 4, 10, 6, 7, podColor)
                line.call(image, 9, 12, 11, 9, podColor)
                put.call(image, 5, 9, shade.call(podColor, 1.15d))
                put.call(image, 10, 11, shade.call(podColor, 1.15d))
            }
            if (kind == 'flower' && stage >= 3) {
                int fy = Math.max(1, top + 1)
                disc.call(image, 7, fy, 2, 2, accent)
                put.call(image, 7, fy, flowerCore)
                put.call(image, 5, fy, shade.call(accent, 1.15d))
                put.call(image, 9, fy, shade.call(accent, 1.15d))
                if (stage >= 5) { put.call(image, 6, fy - 1, accent); put.call(image, 8, fy - 1, accent) }
            }
            if (kind == 'fiber' && stage >= 5) {
                if (crop == 'cotton') {
                    disc.call(image, 6, top + 3, 2, 2, rgb.call('#F1F0E7'))
                    disc.call(image, 9, top + 4, 2, 2, rgb.call('#FFFFFF'))
                } else {
                    disc.call(image, 6, top + 2, 1, 1, rgb.call('#79A9E4'))
                    disc.call(image, 9, top + 3, 1, 1, rgb.call('#79A9E4'))
                }
            }
            if (kind == 'root' && stage >= 5) {
                line.call(image, 7, 14, 4, 12, leafLight)
                line.call(image, 7, 14, 10, 12, leafLight)
            }
            // Ages 4-7 progressively add side growth, so the cycle is visibly developmental
            // even for crops whose harvested organ is small or hidden below the soil line.
            if (stage >= 4) {
                int branchCount = stage - 3
                for (int branch = 0; branch < branchCount; branch++) {
                    int y = 12 - branch * 2
                    int direction = branch % 2 == 0 ? -1 : 1
                    int reach = stage >= 6 ? 3 : 2
                    int tipX = 7 + direction * reach
                    int branchColor = branch % 2 == 0 ? leafLight : leaf
                    line.call(image, 7, y, tipX, y - 2, branchColor)
                    put.call(image, tipX, y - 2, branchColor)
                }
            }
            cropSpecificStageDetail.call(image, crop, stage, top, accent, leaf, leafDark, leafLight)
            // Keep every age visibly distinct even if a large mature organ overlaps the stem.
            // The changing tip highlight follows the plant's growth height and crop accent.
            int growthTipY = Math.max(1, top)
            put.call(image, 7, growthTipY, shade.call(accent, 0.72d + stage * 0.05d))
            if (pollinated && stage >= 4) {
                put.call(image, 4, Math.min(13, top + 5), pollen)
                put.call(image, 11, Math.min(13, top + 6), pollen)
                put.call(image, 5, Math.min(14, top + 6), flowerCore)
            }
            image
        }

        def itemTexture = { String crop, boolean seeds ->
            BufferedImage image = new BufferedImage(16, 16, BufferedImage.TYPE_INT_ARGB)
            int accent = rgb.call(palettes[crop].toString())
            int dark = shade.call(accent, 0.72d)
            int light = shade.call(accent, 1.22d)
            int green = rgb.call('#4E9845')
            int greenDark = rgb.call('#2D6B35')
            int greenLight = rgb.call('#82C35A')
            int cream = rgb.call('#E7D8B8')
            int white = rgb.call('#F3F0E5')
            int yellow = rgb.call('#F2CF4A')
            int red = rgb.call('#C93B43')
            int purple = rgb.call('#76509A')
            String organForm = organFormByCrop[crop].toString()
            String seedForm = seedFormByCrop[crop].toString()

            if (seeds) {
                // Seed icons follow seed morphology, not the harvested organ or foliage palette alone.
                if (seedForm == 'kernel') {
                    if (crop == 'corn') {
                        for (int[] pt : [[5,5],[8,4],[11,5],[5,9],[8,8],[11,9]] as int[][]) {
                            disc.call(image, pt[0], pt[1], 1, 1, yellow)
                            put.call(image, pt[0] - 1, pt[1], shade.call(yellow, 1.15d))
                        }
                    } else if (crop == 'rice') {
                        for (int[] pt : [[5,5],[9,4],[6,8],[10,7],[5,11],[9,10]] as int[][]) {
                            line.call(image, pt[0], pt[1], pt[0] + 1, pt[1] + 2, cream)
                            put.call(image, pt[0], pt[1], light)
                        }
                    } else if (crop == 'barley') {
                        line.call(image, 8, 13, 8, 4, dark)
                        for (int y in [5,7,9]) {
                            line.call(image, 8, y, 5, y - 2, light)
                            line.call(image, 8, y, 11, y - 2, accent)
                        }
                    } else if (crop == 'oat') {
                        line.call(image, 8, 13, 8, 5, dark)
                        line.call(image, 8, 6, 5, 4, accent)
                        line.call(image, 8, 8, 11, 5, accent)
                        line.call(image, 8, 10, 5, 8, light)
                        put.call(image, 5, 4, cream); put.call(image, 11, 5, cream); put.call(image, 5, 8, cream)
                    } else if (crop == 'rye') {
                        for (int[] pt : [[6,5],[9,4],[6,8],[9,7],[6,11],[9,10]] as int[][]) {
                            line.call(image, pt[0], pt[1], pt[0], pt[1] + 2, dark)
                            put.call(image, pt[0], pt[1], accent)
                        }
                    } else if (crop == 'sorghum' || crop == 'millet') {
                        for (int[] pt : [[5,5],[8,4],[11,5],[6,8],[9,7],[5,11],[8,10],[11,11]] as int[][]) {
                            disc.call(image, pt[0], pt[1], crop == 'millet' ? 0 : 1, crop == 'millet' ? 0 : 1, accent)
                            put.call(image, pt[0] - 1, pt[1], light)
                        }
                    } else if (crop == 'buckwheat') {
                        for (int[] pt : [[5,5],[10,4],[7,8],[11,9],[5,11]] as int[][]) {
                            line.call(image, pt[0], pt[1], pt[0] + 1, pt[1] - 1, dark)
                            line.call(image, pt[0] + 1, pt[1] - 1, pt[0] + 2, pt[1] + 1, accent)
                            put.call(image, pt[0] + 1, pt[1], light)
                        }
                    } else { // quinoa: tiny round grains rather than elongated cereal kernels
                        for (int[] pt : [[5,5],[8,4],[11,5],[6,7],[9,7],[12,8],[5,10],[8,11],[11,10]] as int[][]) {
                            put.call(image, pt[0], pt[1], accent)
                            put.call(image, pt[0] - 1, pt[1], light)
                        }
                    }
                } else if (seedForm == 'legume') {
                    if (crop == 'black_bean') {
                        disc.call(image, 5, 6, 2, 2, rgb.call('#292827'))
                        disc.call(image, 10, 10, 2, 2, rgb.call('#292827'))
                        put.call(image, 4, 6, cream); put.call(image, 9, 10, cream)
                    } else if (crop == 'peanut') {
                        disc.call(image, 5, 7, 2, 3, cream)
                        disc.call(image, 10, 9, 2, 3, accent)
                        line.call(image, 5, 5, 6, 9, dark)
                        line.call(image, 10, 7, 11, 11, dark)
                    } else if (crop == 'chickpea') {
                        disc.call(image, 5, 7, 2, 2, cream)
                        disc.call(image, 10, 9, 2, 2, accent)
                        put.call(image, 7, 7, dark); put.call(image, 12, 9, dark)
                    } else if (crop == 'lentil') {
                        disc.call(image, 5, 7, 2, 1, accent)
                        disc.call(image, 10, 9, 2, 1, light)
                        disc.call(image, 8, 5, 2, 1, dark)
                    } else if (crop == 'pea') {
                        disc.call(image, 4, 7, 2, 2, greenLight)
                        disc.call(image, 8, 6, 2, 2, green)
                        disc.call(image, 12, 8, 2, 2, greenLight)
                        put.call(image, 4, 6, cream); put.call(image, 8, 5, cream)
                    } else if (crop == 'green_bean') {
                        disc.call(image, 5, 6, 2, 1, cream)
                        disc.call(image, 10, 9, 2, 1, light)
                        put.call(image, 4, 6, greenDark); put.call(image, 9, 9, greenDark)
                    } else { // soybean
                        disc.call(image, 5, 7, 2, 2, rgb.call('#9FAF62'))
                        disc.call(image, 10, 9, 2, 2, rgb.call('#B7C77A'))
                        put.call(image, 5, 6, cream); put.call(image, 10, 8, cream)
                    }
                } else if (seedForm == 'oilseed') {
                    if (crop == 'sunflower_seed') {
                        for (int[] pt : [[5,5],[9,4],[11,8],[6,10]] as int[][]) {
                            line.call(image, pt[0], pt[1], pt[0] + 1, pt[1] + 3, rgb.call('#38332E'))
                            put.call(image, pt[0], pt[1] + 1, cream)
                        }
                    } else if (crop == 'sesame') {
                        for (int[] pt : [[5,5],[9,4],[11,7],[6,10],[10,11]] as int[][]) {
                            line.call(image, pt[0], pt[1], pt[0] + 1, pt[1] + 1, cream)
                            put.call(image, pt[0], pt[1], rgb.call('#F1E6CF'))
                        }
                    } else if (crop == 'flax') {
                        for (int[] pt : [[5,5],[9,4],[11,8],[6,10],[9,11]] as int[][]) {
                            disc.call(image, pt[0], pt[1], 1, 0, rgb.call('#72523A'))
                            put.call(image, pt[0] + 1, pt[1], rgb.call('#A9855D'))
                        }
                    } else {
                        for (int[] pt : [[4,5],[7,4],[10,5],[5,8],[9,8],[12,9],[6,11],[10,12]] as int[][]) {
                            disc.call(image, pt[0], pt[1], 1, 1, crop == 'canola' ? yellow : shade.call(yellow, 0.88d))
                        }
                    }
                } else if (seedForm == 'nightshade') {
                    if (crop == 'tomato') {
                        for (int[] pt : [[5,5],[9,4],[11,7],[6,9],[10,11]] as int[][]) disc.call(image, pt[0], pt[1], 1, 0, cream)
                    } else if (crop == 'eggplant') {
                        for (int[] pt : [[5,5],[9,4],[11,7],[6,9],[10,11]] as int[][]) {
                            disc.call(image, pt[0], pt[1], 1, 0, rgb.call('#E8D7A5'))
                            put.call(image, pt[0], pt[1] + 1, cream)
                        }
                    } else {
                        for (int[] pt : [[5,5],[9,4],[11,7],[6,9],[10,11]] as int[][]) {
                            disc.call(image, pt[0], pt[1], 1, 0, white)
                            put.call(image, pt[0], pt[1] + 1, cream)
                        }
                    }
                } else if (seedForm == 'cucurbit') {
                    for (int[] pt : [[5,5],[9,4],[11,8],[6,10]] as int[][]) {
                        disc.call(image, pt[0], pt[1], 2, 1, cream)
                        line.call(image, pt[0] - 1, pt[1], pt[0] + 1, pt[1], dark)
                    }
                } else if (seedForm == 'berry') {
                    for (int[] pt : [[4,5],[7,4],[10,5],[12,7],[5,9],[8,8],[11,10],[7,12]] as int[][]) {
                        put.call(image, pt[0], pt[1], crop == 'strawberry' ? rgb.call('#D7B14A') : dark)
                        put.call(image, pt[0] + 1, pt[1], crop == 'cranberry' ? light : cream)
                    }
                } else if (seedForm == 'brassica') {
                    for (int[] pt : [[5,5],[8,4],[11,5],[6,8],[10,8],[5,11],[9,11]] as int[][]) {
                        disc.call(image, pt[0], pt[1], 1, 1, crop == 'bok_choy' ? rgb.call('#514B3C') : dark)
                        put.call(image, pt[0] - 1, pt[1], shade.call(accent, 0.82d))
                    }
                } else if (seedForm == 'allium') {
                    for (int[] pt : [[5,5],[9,4],[11,7],[6,9],[10,11]] as int[][]) {
                        line.call(image, pt[0], pt[1], pt[0] + 1, pt[1] + 1, rgb.call('#272724'))
                        put.call(image, pt[0], pt[1], rgb.call('#6C665B'))
                    }
                } else if (seedForm == 'root') {
                    if (crop == 'sweet_potato') {
                        line.call(image, 5, 12, 5, 7, green)
                        line.call(image, 5, 7, 8, 4, greenLight)
                        disc.call(image, 10, 11, 2, 2, accent)
                    } else if (crop == 'parsnip') {
                        line.call(image, 4, 6, 8, 4, cream)
                        line.call(image, 8, 4, 12, 6, cream)
                        line.call(image, 4, 6, 8, 8, light)
                        line.call(image, 8, 8, 12, 6, cream)
                    } else {
                        for (int[] pt : [[5,5],[9,4],[11,8],[6,10]] as int[][]) {
                            disc.call(image, pt[0], pt[1], 1, 1, rgb.call('#9D7D54'))
                            put.call(image, pt[0], pt[1] - 1, cream)
                        }
                    }
                } else if (seedForm == 'herb') {
                    if (crop == 'lavender') {
                        for (int[] pt : [[5,5],[9,4],[11,7],[6,10],[9,11]] as int[][]) line.call(image, pt[0], pt[1], pt[0], pt[1] + 2, rgb.call('#59443E'))
                    } else if (crop == 'basil') {
                        for (int[] pt : [[5,5],[8,4],[11,6],[6,9],[10,11]] as int[][]) disc.call(image, pt[0], pt[1], 1, 1, rgb.call('#292B26'))
                    } else if (crop == 'cilantro' || crop == 'fennel') {
                        for (int[] pt : [[5,5],[9,4],[11,7],[6,10]] as int[][]) {
                            disc.call(image, pt[0], pt[1], 1, 1, accent)
                            line.call(image, pt[0] - 1, pt[1] - 1, pt[0] + 1, pt[1] + 1, dark)
                        }
                    } else {
                        for (int[] pt : [[5,5],[9,4],[11,7],[6,10],[9,11]] as int[][]) {
                            disc.call(image, pt[0], pt[1], 1, 1, dark)
                            put.call(image, pt[0], pt[1] - 1, light)
                        }
                    }
                } else if (seedForm == 'rhizome') {
                    line.call(image, 4, 8, 7, 6, accent)
                    line.call(image, 7, 6, 10, 8, accent)
                    line.call(image, 10, 8, 12, 7, accent)
                    put.call(image, 6, 6, greenLight); put.call(image, 10, 7, greenLight)
                    put.call(image, 7, 8, light)
                    if (crop == 'turmeric') put.call(image, 8, 7, yellow)
                } else if (seedForm == 'fiber') {
                    disc.call(image, 8, 9, 2, 3, dark)
                    disc.call(image, 6, 6, 2, 2, white)
                    disc.call(image, 9, 5, 2, 2, white)
                    put.call(image, 8, 4, cream)
                } else if (seedForm == 'flower') {
                    line.call(image, 5, 5, 7, 10, dark)
                    line.call(image, 8, 4, 10, 9, accent)
                    line.call(image, 11, 6, 12, 11, dark)
                    put.call(image, 7, 8, light)
                } else if (seedForm == 'stalk') {
                    for (int[] pt : [[5,5],[9,4],[11,7],[6,10],[9,11]] as int[][]) {
                        line.call(image, pt[0], pt[1], pt[0], pt[1] + 2, dark)
                        put.call(image, pt[0] + 1, pt[1] + 1, light)
                    }
                } else if (seedForm == 'leafy') {
                    if (crop == 'lettuce') {
                        for (int[] pt : [[5,5],[9,4],[11,7],[6,10]] as int[][]) line.call(image, pt[0], pt[1], pt[0] + 1, pt[1] + 2, cream)
                    } else if (crop == 'spinach') {
                        for (int[] pt : [[5,5],[9,4],[11,7],[6,10]] as int[][]) disc.call(image, pt[0], pt[1], 1, 1, rgb.call('#7D6B4C'))
                    } else {
                        for (int[] pt : [[5,5],[9,4],[11,7],[6,10]] as int[][]) {
                            disc.call(image, pt[0], pt[1], 1, 1, dark)
                            put.call(image, pt[0] + 1, pt[1], light)
                        }
                    }
                } else { // okra: many dark seeds from a ribbed capsule
                    disc.call(image, 8, 7, 3, 3, greenDark)
                    for (int[] pt : [[6,5],[8,4],[10,5],[6,8],[8,7],[10,8],[7,10],[9,10]] as int[][]) disc.call(image, pt[0], pt[1], 1, 1, rgb.call('#37352F'))
                    line.call(image, 8, 4, 8, 10, greenLight)
                }
            } else if (organForm == 'grain') {

                if (crop == 'corn') {
                    line.call(image, 5, 3, 10, 12, greenDark)
                    line.call(image, 6, 3, 11, 12, green)
                    line.call(image, 6, 4, 10, 11, yellow)
                    for (int y = 5; y <= 10; y++) {
                        put.call(image, 7 + (y % 2), y, shade.call(yellow, 0.9d))
                        put.call(image, 8 + (y % 2), y + 1, yellow)
                    }
                    line.call(image, 5, 10, 3, 13, green)
                    line.call(image, 9, 11, 13, 13, greenLight)
                } else {
                    line.call(image, 8, 14, 8, 3, greenDark)
                    for (int y = 4; y <= 11; y += 2) {
                        put.call(image, 6, y, accent)
                        put.call(image, 7, y - 1, light)
                        put.call(image, 9, y + 1, dark)
                    }
                    if (crop == 'rice') {
                        line.call(image, 8, 5, 11, 8, accent)
                        line.call(image, 11, 8, 12, 11, light)
                        put.call(image, 12, 11, cream)
                    } else if (crop == 'barley') {
                        for (int y = 4; y <= 9; y++) {
                            line.call(image, 8, y, 5, y - 2, light)
                            line.call(image, 8, y, 11, y - 2, accent)
                        }
                    } else if (crop == 'oat') {
                        line.call(image, 8, 6, 5, 4, accent)
                        line.call(image, 8, 7, 11, 4, accent)
                        put.call(image, 5, 4, cream)
                        put.call(image, 11, 4, cream)
                    } else if (crop == 'rye') {
                        for (int y = 4; y <= 10; y++) {
                            put.call(image, 7, y, accent)
                            put.call(image, 9, y, dark)
                        }
                    } else if (crop == 'sorghum' || crop == 'millet') {
                        disc.call(image, 8, 5, crop == 'sorghum' ? 3 : 2, crop == 'sorghum' ? 3 : 2, accent)
                        for (int[] pt : [[6,4],[8,3],[10,5],[7,6],[9,7],[6,6]] as int[][]) put.call(image, pt[0], pt[1], light)
                    } else if (crop == 'buckwheat') {
                        put.call(image, 6, 5, dark); put.call(image, 8, 4, accent); put.call(image, 9, 6, light)
                        put.call(image, 6, 8, accent); put.call(image, 9, 9, dark)
                    } else if (crop == 'quinoa') {
                        for (int[] pt : [[6,4],[8,4],[10,5],[6,6],[8,7],[10,8],[7,9],[9,10]] as int[][]) disc.call(image, pt[0], pt[1], 1, 1, accent)
                    }
                }
            } else if (organForm == 'fruit') {
                if (crop == 'cucumber') {
                    line.call(image, 4, 13, 10, 3, rgb.call('#2E743A'))
                    line.call(image, 5, 13, 11, 3, accent)
                    line.call(image, 6, 12, 12, 2, light)
                    for (int y in [5,8,11]) put.call(image, 6 + (y % 2), y, greenDark)
