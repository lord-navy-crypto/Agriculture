                disc.call(image, 7, 8, 2, 1, accent)
                disc.call(image, 10, 10, 2, 1, accent)
                line.call(image, 3, 9, 6, 7, accent)
                line.call(image, 6, 7, 9, 9, accent)
                line.call(image, 9, 9, 12, 7, accent)
                line.call(image, 5, 11, 8, 10, dark)
                line.call(image, 8, 10, 11, 12, dark)
                put.call(image, 5, 8, light); put.call(image, 7, 7, light); put.call(image, 10, 8, light)
                if (crop == 'turmeric') {
                    line.call(image, 4, 9, 7, 8, yellow)
                    line.call(image, 8, 10, 11, 9, yellow)
                    put.call(image, 7, 10, yellow)
                } else {
                    put.call(image, 6, 9, cream); put.call(image, 9, 10, cream)
                }
            } else if (organForm == 'root') {
                if (crop == 'radish') {
                    disc.call(image, 8, 8, 3, 3, red)
                    line.call(image, 7, 10, 8, 14, white)
                    line.call(image, 9, 10, 8, 14, white)
                    line.call(image, 7, 6, 5, 3, green)
                } else if (crop == 'turnip') {
                    disc.call(image, 8, 8, 3, 3, white)
                    disc.call(image, 8, 6, 3, 2, purple)
                    line.call(image, 8, 10, 8, 14, cream)
                    line.call(image, 7, 5, 5, 2, green)
                } else if (crop == 'sweet_potato') {
                    disc.call(image, 5, 11, 2, 2, accent)
                    disc.call(image, 8, 8, 2, 2, accent)
                    disc.call(image, 11, 7, 2, 1, accent)
                    line.call(image, 4, 11, 7, 7, accent)
                    line.call(image, 7, 7, 12, 6, accent)
                    line.call(image, 4, 12, 9, 9, dark)
                    line.call(image, 5, 10, 6, 8, light)
                    put.call(image, 12, 6, dark)
                } else {
                    line.call(image, 8, 3, 5, 11, accent)
                    line.call(image, 8, 3, 11, 11, accent)
                    line.call(image, 5, 11, 8, 14, light)
                    line.call(image, 11, 11, 8, 14, dark)
                    put.call(image, 8, 4, cream)
                }
            } else if (organForm == 'seed') {
                if (crop == 'sunflower_seed') {
                    disc.call(image, 8, 8, 3, 4, rgb.call('#3C3831'))
                    for (int y = 5; y <= 10; y += 2) put.call(image, 8, y, cream)
                    put.call(image, 6, 7, light); put.call(image, 10, 9, light)
                } else if (crop == 'black_bean') {
                    disc.call(image, 6, 8, 3, 2, rgb.call('#A6A198'))
                    disc.call(image, 6, 8, 2, 1, rgb.call('#302D2B'))
                    disc.call(image, 10, 10, 3, 2, rgb.call('#A6A198'))
                    disc.call(image, 10, 10, 2, 1, rgb.call('#302D2B'))
                    put.call(image, 5, 7, rgb.call('#E1D8CA'))
                    put.call(image, 9, 9, rgb.call('#E1D8CA'))
                } else if (crop == 'sesame' || crop == 'mustard' || crop == 'canola') {
                    for (int[] pt : [[5,5],[8,4],[11,6],[4,9],[7,10],[10,11]] as int[][]) disc.call(image, pt[0], pt[1], 1, 1, crop == 'mustard' || crop == 'canola' ? yellow : cream)
                } else {
                    disc.call(image, 5, 7, 2, 2, accent)
                    disc.call(image, 10, 9, 2, 2, dark)
                    put.call(image, 5, 6, light); put.call(image, 10, 8, light)
                }
            } else if (organForm == 'pod') {
                if (crop == 'peanut') {
                    disc.call(image, 6, 8, 2, 4, cream)
                    disc.call(image, 10, 8, 2, 4, accent)
                    line.call(image, 8, 5, 8, 12, dark)
                    put.call(image, 5, 5, light); put.call(image, 11, 11, dark)
                } else if (crop == 'okra') {
                    line.call(image, 5, 13, 9, 4, greenDark)
                    line.call(image, 6, 13, 10, 4, green)
                    line.call(image, 7, 12, 11, 3, greenLight)
                    for (int y = 6; y <= 11; y += 2) put.call(image, 7 + (y % 2), y, dark)
                    put.call(image, 10, 3, greenDark)
                } else {
                    line.call(image, 3, 10, 12, 5, green)
                    line.call(image, 4, 11, 13, 6, greenLight)
                    line.call(image, 4, 9, 12, 4, greenDark)
                    for (int x in [5,7,9,11]) disc.call(image, x, 7 + (x % 2), 1, 1, crop == 'pea' ? greenLight : accent)
                    put.call(image, 3, 10, greenDark); put.call(image, 12, 5, greenDark)
                }
            } else if (organForm == 'leaf') {
                if (crop == 'swiss_chard') {
                    line.call(image, 8, 14, 8, 4, red)
                    disc.call(image, 5, 6, 3, 2, green)
                    disc.call(image, 11, 7, 3, 2, greenLight)
                    line.call(image, 8, 9, 5, 6, white)
                    line.call(image, 8, 10, 11, 7, white)
                } else if (crop == 'bok_choy') {
                    line.call(image, 5, 14, 5, 6, white)
                    line.call(image, 8, 14, 8, 4, cream)
                    line.call(image, 11, 14, 11, 6, white)
                    disc.call(image, 5, 5, 2, 2, green)
                    disc.call(image, 8, 4, 2, 2, greenLight)
                    disc.call(image, 11, 5, 2, 2, green)
                } else if (crop == 'dill') {
                    line.call(image, 8, 14, 8, 4, greenDark)
                    for (int y in [5,7,9,11]) {
                        line.call(image, 8, y, 4, y - 2, greenLight)
                        line.call(image, 8, y, 12, y - 2, green)
                        put.call(image, 4, y - 2, greenDark); put.call(image, 12, y - 2, greenDark)
                    }
                } else if (crop == 'cilantro' || crop == 'parsley' || crop == 'arugula') {
                    line.call(image, 8, 13, 8, 7, greenDark)
                    for (int[] pt : [[5,7],[6,5],[10,6],[11,8],[5,10],[10,11]] as int[][]) {
                        put.call(image, pt[0], pt[1], crop == 'arugula' ? greenDark : greenLight)
                        put.call(image, pt[0] + 1, pt[1], green)
                    }
                    line.call(image, 8, 9, 5, 6, greenDark)
                    line.call(image, 8, 9, 11, 7, greenDark)
                } else if (crop == 'mint' || crop == 'basil') {
                    line.call(image, 8, 14, 8, 4, greenDark)
                    disc.call(image, 5, 7, 2, 3, green)
                    disc.call(image, 11, 6, 2, 3, greenLight)
                    disc.call(image, 5, 11, 2, 2, greenLight)
                    disc.call(image, 11, 10, 2, 2, green)
                    line.call(image, 5, 7, 8, 9, greenDark)
                    line.call(image, 11, 6, 8, 9, greenDark)
                } else if (crop == 'spinach') {
                    line.call(image, 4, 12, 8, 3, green)
                    line.call(image, 8, 3, 12, 12, greenLight)
                    line.call(image, 4, 12, 12, 12, greenDark)
                    line.call(image, 8, 3, 8, 13, greenDark)
                } else if (crop == 'kale') {
                    disc.call(image, 5, 7, 3, 3, green)
                    disc.call(image, 10, 6, 3, 3, greenLight)
                    put.call(image, 4, 5, greenDark); put.call(image, 11, 4, greenDark)
                    put.call(image, 5, 10, greenDark); put.call(image, 10, 9, greenDark)
                } else if (crop == 'lettuce') {
                    disc.call(image, 8, 8, 4, 3, greenLight)
                    disc.call(image, 5, 10, 3, 2, green)
                    disc.call(image, 11, 10, 3, 2, green)
                    line.call(image, 8, 5, 8, 12, greenDark)
                    line.call(image, 8, 8, 5, 10, greenDark)
                    line.call(image, 8, 8, 11, 10, greenDark)
                } else {
                    line.call(image, 8, 14, 8, 4, greenDark)
                    disc.call(image, 5, 7, 2, 3, green)
                    disc.call(image, 11, 6, 2, 3, greenLight)
                    line.call(image, 8, 9, 5, 7, greenDark)
                    line.call(image, 8, 8, 11, 6, greenDark)
                }
            } else if (organForm == 'head') {
                if (crop == 'broccoli') {
                    line.call(image, 8, 14, 8, 8, greenDark)
                    disc.call(image, 5, 6, 3, 3, green)
                    disc.call(image, 8, 4, 3, 3, greenLight)
                    disc.call(image, 11, 6, 3, 3, green)
                    put.call(image, 8, 3, greenDark); put.call(image, 5, 5, greenDark)
                } else if (crop == 'cauliflower') {
                    disc.call(image, 5, 7, 3, 3, white)
                    disc.call(image, 8, 5, 3, 3, cream)
                    disc.call(image, 11, 7, 3, 3, white)
                    line.call(image, 8, 10, 8, 14, green)
                } else if (crop == 'brussels_sprouts') {
                    for (int[] pt : [[5,6],[9,5],[7,9],[11,9]] as int[][]) {
                        disc.call(image, pt[0], pt[1], 2, 2, green)
                        put.call(image, pt[0], pt[1] - 1, greenLight)
                    }
                } else if (crop == 'artichoke') {
                    line.call(image, 8, 14, 8, 8, greenDark)
                    disc.call(image, 8, 6, 3, 4, green)
                    for (int y in [4,6,8]) { put.call(image, 6, y, greenLight); put.call(image, 10, y, greenDark) }
                    put.call(image, 8, 2, greenLight)
                } else { // cabbage
                    disc.call(image, 8, 8, 4, 4, green)
                    disc.call(image, 8, 8, 3, 3, greenLight)
                    line.call(image, 8, 5, 8, 12, cream)
                    line.call(image, 5, 8, 11, 8, greenDark)
                    line.call(image, 6, 6, 10, 10, greenDark)
                }
            } else if (organForm == 'fiber' || organForm == 'fiber_seed') {
                if (crop == 'cotton') {
                    line.call(image, 8, 14, 8, 8, greenDark)
                    disc.call(image, 5, 6, 3, 3, white)
                    disc.call(image, 10, 6, 3, 3, white)
                    disc.call(image, 8, 4, 3, 3, cream)
                    put.call(image, 5, 6, rgb.call('#B6A58B'))
                    put.call(image, 10, 6, rgb.call('#B6A58B'))
                } else { // flax fiber with its distinctive blue flowers/capsules
                    line.call(image, 8, 14, 8, 4, greenDark)
                    disc.call(image, 5, 5, 2, 2, rgb.call('#79A9E4'))
                    disc.call(image, 10, 6, 2, 2, rgb.call('#79A9E4'))
                    put.call(image, 5, 4, white); put.call(image, 10, 5, white)
                    line.call(image, 8, 11, 5, 9, green)
                }
            } else if (organForm == 'flower') {
                if (crop == 'lavender') {
                    line.call(image, 8, 14, 8, 2, greenDark)
                    for (int y in [3,5,7,9]) {
                        put.call(image, 6, y, purple); put.call(image, 8, y, accent); put.call(image, 10, y, purple)
                    }
                    put.call(image, 7, 2, light); put.call(image, 9, 4, light)
                } else { // clover flower and three leaflets
                    line.call(image, 8, 14, 8, 7, greenDark)
                    disc.call(image, 5, 9, 2, 2, green)
                    disc.call(image, 10, 9, 2, 2, greenLight)
                    disc.call(image, 8, 6, 2, 2, green)
                    disc.call(image, 7, 3, 2, 2, rgb.call('#D9B7C9'))
                    disc.call(image, 9, 3, 2, 2, rgb.call('#F0DDE8'))
                    put.call(image, 8, 3, yellow)
                }
            } else if (organForm == 'stalk') {
                if (crop == 'celery') {
                    line.call(image, 4, 14, 5, 4, cream)
                    line.call(image, 7, 14, 7, 2, greenLight)
                    line.call(image, 10, 14, 11, 4, cream)
                    line.call(image, 5, 7, 3, 3, green)
                    line.call(image, 11, 7, 13, 3, green)
                } else { // leek
                    line.call(image, 5, 14, 5, 4, white)
                    line.call(image, 8, 14, 8, 2, greenLight)
                    line.call(image, 11, 14, 11, 4, green)
                    line.call(image, 5, 5, 4, 2, greenDark)
                    line.call(image, 8, 4, 8, 1, greenDark)
                }
            }
            image
        }

        int modelCount = 0
        int blockTextureCount = 0
        int itemTextureCount = 0
        def matureTextureHashes = [] as Set
        def allStageHashes = [] as Set
        def digest = MessageDigest.getInstance('SHA-256')
        cropIds.each { crop ->
            def thisCropStageHashes = [] as Set
            (0..7).each { age ->
                BufferedImage image = stageTexture.call(crop, age, false)
                String modelName = crop + '_stage' + age
                String texturePath = 'assets/gugugaga/textures/block/crops/' + modelName + '.png'
                savePng.call(texturePath, image)
                blockTextureCount++
                String signature = digest.digest(new File(outputRoot, texturePath).bytes).encodeHex().toString()
                thisCropStageHashes.add(signature)
                allStageHashes.add(signature)
                if (age == 7) matureTextureHashes.add(signature)
                saveJson.call('assets/gugugaga/models/block/crops/' + modelName + '.json', [
                    parent:'minecraft:block/crop', textures:[crop:'gugugaga:block/crops/' + modelName]
                ])
                modelCount++
                if (age >= 4) {
                    String pollenModel = modelName + '_pollinated'
                    String pollenPath = 'assets/gugugaga/textures/block/crops/' + pollenModel + '.png'
                    savePng.call(pollenPath, stageTexture.call(crop, age, true))
                    blockTextureCount++
                    String pollenSignature = digest.digest(new File(outputRoot, pollenPath).bytes).encodeHex().toString()
                    if (pollenSignature == signature) throw new GradleException('Pollinated stage must have a distinct texture: ' + modelName)
                    allStageHashes.add(pollenSignature)
                    saveJson.call('assets/gugugaga/models/block/crops/' + pollenModel + '.json', [
                        parent:'minecraft:block/crop', textures:[crop:'gugugaga:block/crops/' + pollenModel]
                    ])
                    modelCount++
                }
            }
            if (thisCropStageHashes.size() != 8) throw new GradleException('Growth stages must all have distinct sprites: ' + crop)
            savePng.call('assets/gugugaga/textures/item/crops/' + crop + '.png', itemTexture.call(crop, false))
            itemTextureCount++
            savePng.call('assets/gugugaga/textures/item/crops/' + crop + '_seeds.png', itemTexture.call(crop, true))
            itemTextureCount++
        }
        if (modelCount != 768 || blockTextureCount != 768 || itemTextureCount != 128) {
            throw new GradleException('Unexpected crop asset count: models=' + modelCount + ', block textures=' + blockTextureCount + ', item textures=' + itemTextureCount)
        }
        if (matureTextureHashes.size() != 64) throw new GradleException('Every crop must have a unique mature texture')
        if (allStageHashes.size() != 768) throw new GradleException('Crop growth/pollination stage textures must be unique')
        // Produce a reviewable visual proof sheet for all crop ages and pollen variants.
        // This is a build report only; it is not packaged as a game texture.
        int tile = 48
        int labelWidth = 112
        int columns = 12 // age 0..7, then pollinated ages 4..7
        BufferedImage contactSheet = new BufferedImage(
                labelWidth + columns * tile, cropIds.size() * tile, BufferedImage.TYPE_INT_ARGB)
        Graphics2D graphics = contactSheet.createGraphics()
        graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_NEAREST_NEIGHBOR)
        graphics.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_OFF)
        graphics.setColor(new Color(29, 34, 30, 255))
        graphics.fillRect(0, 0, contactSheet.width, contactSheet.height)
        graphics.setFont(new Font(Font.SANS_SERIF, Font.PLAIN, 10))
        cropIds.eachWithIndex { crop, row ->
            int y = row * tile
            graphics.setColor(new Color(238, 240, 232, 255))
            graphics.drawString(crop.toString(), 4, y + 28)
            (0..7).each { age ->
                File png = new File(outputRoot, 'assets/gugugaga/textures/block/crops/' + crop + '_stage' + age + '.png')
                graphics.drawImage(ImageIO.read(png), labelWidth + age * tile, y, tile, tile, null)
            }
            (4..7).each { age ->
                File png = new File(outputRoot, 'assets/gugugaga/textures/block/crops/' + crop + '_stage' + age + '_pollinated.png')
                graphics.drawImage(ImageIO.read(png), labelWidth + (8 + age - 4) * tile, y, tile, tile, null)
            }
        }
        graphics.dispose()
        File reportRoot = layout.buildDirectory.dir('reports/agriculture').get().asFile
        reportRoot.mkdirs()
        ImageIO.write(contactSheet, 'png', new File(reportRoot, 'crop-stage-contact-sheet.png'))
        new File(reportRoot, 'crop-stage-contact-sheet.txt').setText(
                'Rows are crop IDs in alphabetical order. Columns 1-8 are ages 0-7; columns 9-12 are pollinated ages 4-7. Sprites are enlarged with nearest-neighbor scaling.\\n',
                'UTF-8')
        def writeItemContactSheet = { boolean seeds ->
            BufferedImage sheet = new BufferedImage(labelWidth + tile, cropIds.size() * tile, BufferedImage.TYPE_INT_ARGB)
            Graphics2D sheetGraphics = sheet.createGraphics()
            sheetGraphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_NEAREST_NEIGHBOR)
            sheetGraphics.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_OFF)
            sheetGraphics.setColor(new Color(29, 34, 30, 255))
            sheetGraphics.fillRect(0, 0, sheet.width, sheet.height)
            sheetGraphics.setFont(new Font(Font.SANS_SERIF, Font.PLAIN, 10))
            cropIds.eachWithIndex { crop, row ->
                int y = row * tile
                sheetGraphics.setColor(new Color(238, 240, 232, 255))
                sheetGraphics.drawString(crop.toString(), 4, y + 28)
                String iconName = crop.toString() + (seeds ? '_seeds.png' : '.png')
                File iconFile = new File(outputRoot, 'assets/gugugaga/textures/item/crops/' + iconName)
                sheetGraphics.drawImage(ImageIO.read(iconFile), labelWidth, y, tile, tile, null)
            }
            sheetGraphics.dispose()
            String sheetName = seeds ? 'seed-icon-contact-sheet.png' : 'produce-icon-contact-sheet.png'
            ImageIO.write(sheet, 'png', new File(reportRoot, sheetName))
        }
        writeItemContactSheet.call(false)
        writeItemContactSheet.call(true)
        logger.lifecycle('CROP_ASSET_GENERATOR_OK: 64 crops; 8 unique stages each; 4 pollen-marked stages per crop; 128 organ-specific item icons; 768 crop models; crop-stage, produce-icon and seed-icon contact sheets written.')
    }
}
tasks.named('processResources').configure {
    dependsOn tasks.named('generateCropAssets')
}
