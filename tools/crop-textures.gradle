                        put.call(image, pt[0] + 1, pt[1], dark)
                    }
                    put.call(image, 5, 7, cream); put.call(image, 9, 5, cream); put.call(image, 10, 9, cream)
                } else if (crop == 'raspberry') {
                    for (int[] pt : [[6,6],[8,5],[10,7],[6,9],[8,9],[10,10],[8,12]] as int[][]) disc.call(image, pt[0], pt[1], 1, 1, accent)
                    put.call(image, 8, 4, green); put.call(image, 7, 5, greenLight)
