                    line.call(image, 5, 11, 13, 3, light)
                    put.call(image, 6, 9, greenLight); put.call(image, 8, 7, greenLight); put.call(image, 10, 5, greenLight)
                } else if (crop == 'eggplant') {
                    line.call(image, 5, 13, 10, 5, purple)
                    line.call(image, 6, 13, 11, 5, accent)
                    line.call(image, 7, 12, 12, 4, light)
                    line.call(image, 9, 5, 12, 3, green)
                    put.call(image, 8, 5, greenDark); put.call(image, 10, 4, greenLight)
                } else if (crop == 'chili_pepper') {
                    line.call(image, 4, 5, 7, 8, accent)
                    line.call(image, 7, 8, 11, 12, red)
                    line.call(image, 5, 5, 8, 8, light)
                    put.call(image, 4, 4, green); put.call(image, 5, 5, greenDark)
                } else if (crop == 'bell_pepper') {
                    disc.call(image, 8, 9, 4, 4, accent)
                    disc.call(image, 5, 8, 2, 3, light)
                    disc.call(image, 11, 8, 2, 3, dark)
                    line.call(image, 8, 5, 8, 2, greenDark)
                    line.call(image, 8, 5, 5, 4, green)
                    line.call(image, 8, 5, 11, 4, greenLight)
                } else { // tomato
                    disc.call(image, 8, 8, 4, 4, accent)
                    put.call(image, 6, 6, light); put.call(image, 10, 10, dark)
                    line.call(image, 8, 5, 8, 3, greenDark)
                    line.call(image, 8, 5, 5, 4, green)
                    line.call(image, 8, 5, 11, 4, greenLight)
                    put.call(image, 7, 5, greenDark); put.call(image, 9, 5, greenDark)
                }
            } else if (organForm == 'berry') {
                if (crop == 'strawberry') {
                    disc.call(image, 8, 8, 3, 3, accent)
                    line.call(image, 5, 8, 8, 13, accent)
                    line.call(image, 11, 8, 8, 13, dark)
                    for (int[] pt : [[6,7],[9,7],[7,9],[9,10],[8,12]] as int[][]) put.call(image, pt[0], pt[1], cream)
                    line.call(image, 8, 5, 5, 4, green)
                    line.call(image, 8, 5, 11, 4, greenLight)
                    put.call(image, 8, 4, greenDark)
