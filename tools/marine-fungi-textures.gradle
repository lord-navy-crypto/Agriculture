import groovy.json.JsonSlurper
import java.awt.image.BufferedImage
import javax.imageio.ImageIO
import java.security.MessageDigest

def mfOutput = layout.buildDirectory.dir('generated/resources/marineFungiAssets')
sourceSets.main.resources.srcDir(mfOutput)
tasks.register('generateMarineFungiAssets') {
    inputs.file(file('src/main/resources/data/gugugaga/agronomy/marine_fungi_catalog_v1_0.json'))
    outputs.dir(mfOutput)
    doLast {
        File root = mfOutput.get().asFile
        root.mkdirs()
        def catalog = new JsonSlurper().parse(file('src/main/resources/data/gugugaga/agronomy/marine_fungi_catalog_v1_0.json'))
        if (catalog.items.size() != 24 || catalog.cultures.size() != 6) {
            throw new GradleException('Marine/fungi catalog size mismatch')
        }
        logger.lifecycle('MARINE_FUNGI_DIAGNOSTIC_TASK_OK')
    }
}
tasks.named('processResources').configure {
    dependsOn tasks.named('generateMarineFungiAssets')
}
