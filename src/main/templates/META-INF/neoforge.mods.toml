modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/lord-navy-crypto/Agriculture/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/lord-navy-crypto/Agriculture"
authors="Backroom Agriculture contributors"
description='''
Backroom Agriculture unifies a large farming, food, beekeeping, marine-plant,
and fungi expansion with a six-dimension liminal-horror survival experience.
It includes 108 plantable crops, 27 abstract food-nutrition indicators,
food processing, water and salt systems, pollination, and sustainable farming.
Level 0 and Level 1 feature maze-like spaces, controlled entities, lighting,
supplies, and agriculture-based survival. Levels 2 through 5 add connected
utility, transit, and hotel environments. GeckoLib and Lithostitched provide
animated details and composite world generation. Fusion remains optional.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[4.9.3,5)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="lithostitched"
type="required"
versionRange="[1.7.11,2)"
ordering="AFTER"
side="BOTH"
