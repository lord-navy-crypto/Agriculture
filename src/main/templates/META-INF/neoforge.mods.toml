modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/lord-navy-crypto/Agriculture/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/lord-navy-crypto/Agriculture"
authors="Gugu-Gaga Agriculture contributors"
description='''
A farming and culinary expansion for Minecraft 1.21.1 with 100 plantable crops,
biome-based wild seed sources, 50 honey varieties, beekeeping and pollination,
68 cuisine icons and recipes, marine plants, fungi, and four creative tabs.
Optional Fusion resource-pack enhancements offer randomized crop, marine,
fungal, and bee-habitat textures on compatible clients.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
