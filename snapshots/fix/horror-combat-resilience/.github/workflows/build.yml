name: NeoForge 1.21.1 build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Source and asset integrity checks
        run: python3 -m unittest discover -s qa -p 'test_*.py' -v
      - name: Java 21 observer state-machine executable acceptance
        run: |
          mkdir -p build/observer-brain-smoke
          javac -d build/observer-brain-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/ObserverBrain.java \
            qa/java/ObserverBrainSmoke.java
          java -cp build/observer-brain-smoke ObserverBrainSmoke
      - name: Test optional Nightwatch encounter fairness and budgets (pure Java21)
        run: |
          mkdir -p build/encounter-policy-smoke
          javac -d build/encounter-policy-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/EncounterPolicy.java \
            qa/java/EncounterPolicySmoke.java
          java -cp build/encounter-policy-smoke EncounterPolicySmoke
      - name: Verify v0.3 atmospheric cue timing, opt-out and volume ceilings
        run: |
          mkdir -p build/haunting-cue-smoke
          javac -d build/haunting-cue-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/ObserverBrain.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/HauntingCuePolicy.java \
            qa/java/HauntingCuePolicySmoke.java
          java -cp build/haunting-cue-smoke HauntingCuePolicySmoke
      - name: Verify v0.4 witness journal narrative, deduplication and limits
        run: |
          mkdir -p build/witness-journal-smoke
          javac -d build/witness-journal-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/ObserverBrain.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/WitnessJournalPolicy.java \
            qa/java/WitnessJournalPolicySmoke.java
          java -cp build/witness-journal-smoke WitnessJournalPolicySmoke
      - name: Verify v0.5 suspense event variety and fair director limits
        run: |
          mkdir -p build/haunt-director-smoke
          javac -d build/haunt-director-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/HauntDirectorPolicy.java \
            qa/java/HauntDirectorPolicySmoke.java
          java -cp build/haunt-director-smoke HauntDirectorPolicySmoke
      - name: Verify v0.6 cold-biome relative sighting frequency (120k trials)
        run: |
          mkdir -p build/gugu-cold-smoke
          javac -d build/gugu-cold-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/ColdBiomePolicy.java \
            qa/java/ColdBiomePolicySmoke.java
          java -cp build/gugu-cold-smoke ColdBiomePolicySmoke
      - name: Verify v0.6 offline chat, Unicode handling and response limits
        run: |
          mkdir -p build/gugu-dialogue-smoke
          javac -d build/gugu-dialogue-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/FactionPolicy.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/GuguDialoguePolicy.java \
            qa/java/GuguDialoguePolicySmoke.java
          java -cp build/gugu-dialogue-smoke GuguDialoguePolicySmoke
      - name: Verify v0.7 reversible moods, safety rules, and Redactor factions
        run: |
          mkdir -p build/gugu-dual-nature-smoke
          javac -d build/gugu-dual-nature-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/ThreatPolicy.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/FactionPolicy.java \
            qa/java/ThreatPolicySmoke.java \
            qa/java/FactionPolicySmoke.java
          java -cp build/gugu-dual-nature-smoke ThreatPolicySmoke
          java -cp build/gugu-dual-nature-smoke FactionPolicySmoke
      - name: Verify v0.8 Redactor/Gugu/Smiler reactions and supremacy of Redactor flight
        run: |
          mkdir -p build/gugu-three-relations
          javac -d build/gugu-three-relations \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/ThreeEntityReactionPolicy.java \
            qa/java/ThreeEntityReactionPolicySmoke.java
          java -cp build/gugu-three-relations ThreeEntityReactionPolicySmoke
      - name: Generate and verify original character textures
        run: |
          python3 qa/generate_character_sprites.py build/test-original-sprites
          python3 - <<'PY'
          import pathlib,struct
          base=pathlib.Path('build/test-original-sprites/assets/gugugaga/textures/entity')
          for name in ['lapis_mask.png','redactor_true.png','yellow_smiler.png',
                       'yellow_smiler_true.png','observer_blackened.png']:
              data=(base/name).read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n',name
              assert struct.unpack('>II',data[16:24])==(64,64),name
              print('VALID_ORIGINAL_TEXTURE',name,len(data))
          PY
      - name: Verify v0.9 corruption, deceptive mimic strikes and helping Smiler
        run: |
          mkdir -p build/gugu-advanced-modes
          javac -d build/gugu-advanced-modes \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/CorruptionArcPolicy.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/MimicAttackPolicy.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/SmilerGiftPolicy.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/ThreeEntityReactionPolicy.java \
            qa/java/AdvancedCharacterPolicySmoke.java
          java -cp build/gugu-advanced-modes AdvancedCharacterPolicySmoke
      - name: Verify repeatable v0.10 five-act horror without forced story endings
        run: |
          mkdir -p build/haunt-game-smoke
          javac -d build/haunt-game-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/HauntGameplayPolicy.java \
            qa/java/HauntGameplayPolicySmoke.java
          java -cp build/haunt-game-smoke HauntGameplayPolicySmoke
      - name: Enforce localhost-only Ollama policy (pure Java21)
        run: |
          mkdir -p build/ollama-policy-smoke
          javac -d build/ollama-policy-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/ollama/OllamaEndpointPolicy.java \
            qa/java/OllamaEndpointPolicySmoke.java
          java -cp build/ollama-policy-smoke OllamaEndpointPolicySmoke
      - name: Verify v0.12 triad priorities, LOS escapes and capped scare policies
        run: |
          mkdir -p build/horror-pursuit-smoke
          javac -d build/horror-pursuit-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/ThreeEntityReactionPolicy.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/HorrorChasePolicy.java \
            qa/java/HorrorChasePolicySmoke.java
          java -cp build/horror-pursuit-smoke HorrorChasePolicySmoke
      - name: Verify v0.13 cinematic restraint and location-memory search
        run: |
          mkdir -p build/v013-horror-smoke
          javac -d build/v013-horror-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/HauntGameplayPolicy.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/HorrorChasePolicy.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/CinematicSuspensePolicy.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/LastSeenSearchPolicy.java \
            qa/java/CinematicSuspensePolicySmoke.java \
            qa/java/LastSeenSearchPolicySmoke.java
          java -cp build/v013-horror-smoke CinematicSuspensePolicySmoke
          java -cp build/v013-horror-smoke LastSeenSearchPolicySmoke
      - name: Verify v0.14 500k real-observation and enclosed-sound policy checks
        run: |
          mkdir -p build/v014-evidence-smoke
          javac -d build/v014-evidence-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/HauntGameplayPolicy.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/CinematicSuspensePolicy.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/DepthSuspensePolicy.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/HorrorEvidencePolicy.java \
            qa/java/V014HorrorEvidenceSmoke.java
          java -cp build/v014-evidence-smoke V014HorrorEvidenceSmoke
      - name: Verify v0.15 optional persuasion, mimic and rescue policies
        run: |
          mkdir -p build/v015-deception-smoke
          javac -d build/v015-deception-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/MimicDeceptionPolicy.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/SmilerTrustPolicy.java \
            qa/java/V015DeceptionTrustPolicySmoke.java
          java -cp build/v015-deception-smoke V015DeceptionTrustPolicySmoke
      - name: Verify v0.16 visual effects budgets (300k policy checks)
        run: |
          mkdir -p build/v016-visual-smoke
          javac -d build/v016-visual-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/CinematicVfxPolicy.java \
            qa/java/V016VisualFXPolicySmoke.java
          java -cp build/v016-visual-smoke V016VisualFXPolicySmoke
      - name: Generate offline original-art review (not a gameplay screenshot)
        run: |
          python3 qa/generate_character_sprites.py build/v017-review-resources
          python3 qa/render_visual_review.py build/v017-review-resources build/visual-review
      - name: Verify v0.18 hearing versus stealth, player listening and real cave pressure
        run: |
          mkdir -p build/v018-horror-smoke
          javac -d build/v018-horror-smoke \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/HorrorHearingPolicy.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/HorrorListeningPolicy.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/CaveThreatSoundPolicy.java \
            qa/java/V018HorrorTacticsSmoke.java \
            qa/java/V018CavePressureSmoke.java
          java -cp build/v018-horror-smoke V018HorrorTacticsSmoke
          java -cp build/v018-horror-smoke V018CavePressureSmoke
      - name: Verify v0.20 exact chat, 4-second gaze and chat privacy policy
        run: |
          mkdir -p build/v020-natural-policy
          javac -d build/v020-natural-policy \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/HauntGameplayPolicy.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/GazeInvestigationPolicy.java \
            src/main/java/io/github/lordnavycrypto/gugugaga/ai/YellowHelpChatPolicy.java \
            qa/java/V020NaturalInteractionSmoke.java
          java -cp build/v020-natural-policy V020NaturalInteractionSmoke
      - name: Compile and package NeoForge mod
        run: gradle --no-daemon --stacktrace build
      - name: Audit and assemble exact Sacred Nightwatch RC1 release
        run: python3 qa/package_sacred_rc.py build/libs build/sacred-release
      - uses: actions/upload-artifact@v4
        with:
          name: gugugaga-client-fixed-v0212
          path: build/sacred-release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gugugaga-v017-visual-review
          path: build/visual-review/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gugugaga-nightwatch-jar
          path: build/libs/*.jar
          if-no-files-found: error

  compatibility:
    name: API compatibility NeoForge ${{ matrix.neo }} / GeckoLib ${{ matrix.gecko }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - neo: '21.1.150'
            gecko: '4.9.3'
          - neo: '21.1.200'
            gecko: '4.8.4'
          - neo: '21.1.259'
            gecko: '4.8.2'
          - neo: '21.1.259'
            gecko: '4.9.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile full mod against selected dependencies
        run: >
          gradle --no-daemon --stacktrace
          -Pneo_version=${{ matrix.neo }}
          -Pgeckolib_version=${{ matrix.gecko }}
          build

  runtime-startup:
    name: Real server startup NeoForge ${{ matrix.neo }} / GeckoLib ${{ matrix.gecko }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - neo: '21.1.150'
            gecko: '4.8.2'
          - neo: '21.1.200'
            gecko: '4.8.4'
          - neo: '21.1.259'
            gecko: '4.9.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Actual server boot and mod registry initialization
        env:
          GUGU_BOOT_TIMEOUT: "400"
          GUGU_NEO_VERSION: ${{ matrix.neo }}
          GUGU_GECKOLIB_VERSION: ${{ matrix.gecko }}
        run: >
          python3 qa/smoke_server_boot.py
      - name: Upload server startup diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gugugaga-server-boot-${{ matrix.neo }}-${{ matrix.gecko }}
          path: |
            build/server-runtime-smoke.log
            runs/server/logs/latest.log
            runs/server/crash-reports/*.txt
          if-no-files-found: warn

  client-startup:
    name: REAL graphical client init — GeckoLib renderers and UI input
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Install virtual display with Mesa software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libgl1
      - name: Actually launch Minecraft CLIENT and validate entity renderers plus UI input
        env:
          GUGU_CLIENT_TIMEOUT: "420"
        run: python3 qa/smoke_client_boot.py
      - name: Preserve client crash and runtime logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gugugaga-real-client-boot-v0212
          path: |
            build/client-runtime-smoke.log
            runs/client/logs/latest.log
            runs/client/crash-reports/*.txt
            run/logs/latest.log
          if-no-files-found: warn

  real-gameplay:
    name: REAL in-world gameplay — real entities, chat HELP, V, and five-act cycle
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Install virtual Linux Minecraft controls and OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth xdotool imagemagick libgl1-mesa-dri libgl1
      - name: Enter real survival world and exercise in-game controls
        env:
          GUGU_GAME_TIMEOUT: "570"
        run: xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" python3 qa/gameplay_e2e.py
      - name: Upload screenshot proof and full game logs (even on FAIL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gugugaga-actual-gameplay-e2e
          path: |
            build/gameplay-e2e/*
            run/logs/latest.log
            runs/client/logs/latest.log
            run/crash-reports/*.txt
          if-no-files-found: warn

  horror-combat-policy:
    name: Verify horror entities survive ordinary player weapons and can fight back
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test nonlethal recovery policy
        run: |
          mkdir -p build/combat-policy-smoke
          javac -d build/combat-policy-smoke src/main/java/io/github/lordnavycrypto/gugugaga/ai/HorrorCombatPolicy.java qa/java/HorrorCombatPolicySmoke.java
          java -cp build/combat-policy-smoke HorrorCombatPolicySmoke
      - name: Test integration and in-world damage assertions are present
        run: python3 -m unittest qa.test_combat_resilience -v

  production-jar-consumer:
    name: Install packaged 0.21.3 JAR into a clean NeoForge server
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build the exact distributable JAR
        run: gradle --no-daemon --console=plain build
      - name: Install official NeoForge and GeckoLib into clean mods folder
        env:
          GUGU_CONSUMER_NEO: "21.1.259"
          GUGU_CONSUMER_GECKO: "4.9.3"
          GUGU_CONSUMER_TIMEOUT: "350"
        run: python3 qa/production_jar_server_smoke.py
      - name: Upload clean consumer-install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gugugaga-0.21.3-production-jar-consumer
          path: |
            build/consumer-jar-smoke/*console.log
            build/consumer-jar-smoke/logs/latest.log
            build/consumer-jar-smoke/crash-reports/*.txt
          if-no-files-found: warn
