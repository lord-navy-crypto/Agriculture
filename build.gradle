plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var vars = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_license: mod_license, loader_version_range: loader_version_range,
        minecraft_version_range: minecraft_version_range, neo_version: neo_version
    ]
    inputs.properties(vars)
    expand(vars)
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Generate and package crop-specific growth-stage and inventory sprites.
apply from: 'tools/crop-textures.gradle'
apply from: 'tools/marine-fungi-textures.gradle'
apply from: 'tools/crop-cuisine-textures.gradle'
apply from: 'tools/fusion-visuals.gradle'


// The generated Fusion pack is EMBEDDED as a nested built-in resource pack.
 // It is deliberately NOT overlaid on the root mod resources: the Fusion model
 // loader must not be read unless the Fusion client mod is installed.
tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('generateFusionVisualPack')
    from(fusionPackRoot) {
        into 'resourcepacks/gugugaga_fusion'
    }
}

// Fusion is an OPTIONAL developer/runtime dependency. The core JAR remains standalone.
// Use -PenableFusionDev=true for the client development run; the companion resource pack
// requires Fusion on the client's machine but never on the dedicated server.
repositories {
    maven {
        url = uri('https://api.modrinth.com/maven')
        content { includeGroup('maven.modrinth') }
    }
}
if (providers.gradleProperty('enableFusionDev').map { it == 'true' }.orElse(false).get()) {
    dependencies {
        runtimeOnly 'maven.modrinth:fusion-connected-textures:1.3.16-neoforge-mc1.21.1'
    }
}
